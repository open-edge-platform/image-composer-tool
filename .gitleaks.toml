# Gitleaks configuration.
#
# Extends the default ruleset rather than replacing it, so every built-in rule
# still applies; the allowlist below is the only exception.

[extend]
useDefault = true

[[allowlists]]
description = """
internal/api/http/gen.go is oapi-codegen output. It embeds the OpenAPI document
as a gzipped, base64-encoded blob split across string literals, so the file
carries long runs of high-entropy characters that the generic-api-key heuristic
reports as a credential. The content is the API contract in api/v1, which is in
the repository in plain text, and the file is regenerated by `go generate` --
nothing can be hand-edited into it. Narrowed to that one rule and that one file
so a real secret committed elsewhere in it, or anywhere else, still fails.
"""
targetRules = ["generic-api-key"]
paths = ['''internal/api/http/gen\.go''']
