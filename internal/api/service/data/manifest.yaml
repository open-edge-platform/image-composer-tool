#
# Manifest for the ICT Web UI Basic tab.
#
# Each `combinations` entry maps one UI selection (vertical/sku/platform/os/imageType)
# to a pre-authored, tested template in image-templates/. The backend looks the
# template up and returns/builds it verbatim — it never synthesizes one.
#
# `verticals`, `platforms`, and `targets` supply the display labels the UI uses to
# populate its dropdowns. The UI derives valid cascading options from `combinations`.
#
# A combination with an empty `template` is a planned-but-not-yet-ready selection:
# the UI still lists it (so the supported matrix is exhaustive) but grays it out
# and prevents it from being selected or built until a template is authored.

combinations:
  - vertical: retail
    sku: desktop-virtualization
    platform: arl
    os: debian13
    imageType: iso
    template: debian13-x86_64-desktop-virtualization-iso.yml

  - vertical: robotics
    sku: robotics-jazzy-ubuntu24
    platform: wcl
    os: ubuntu24
    imageType: iso
    template: ubuntu24-x86_64-robotics-jazzy-iso.yml

  # Planned, no template yet — the UI grays this out (not buildable).
  - vertical: robotics
    sku: robotics-jazzy-ubuntu24
    platform: ptl
    os: ubuntu24
    imageType: iso
    template: ""

  # The two Fed Aero host-OS blueprints, vendored from
  # edge-node-infrastructure-blueprint at tag release-2026.2.0 (see
  # image-templates/ubuntu24/README.md for what was changed on the way in).
  - vertical: fed-aero
    sku: generic-handheld-blueprint
    platform: ptl
    os: ubuntu24
    imageType: raw
    template: ubuntu24/generic-handheld-os-template.yml

  - vertical: fed-aero
    sku: generic-companion-os-server-blueprint
    platform: ptl
    os: ubuntu24
    imageType: raw
    template: ubuntu24/generic-companion-os-server-template.yml

  # Planned, no template yet — the UI grays this out (not buildable).
  - vertical: fed-aero
    sku: drone-image-bkc
    platform: ptl
    os: ubuntu26-server
    imageType: raw
    template: ""

  # ── EXAMPLE (commented): adding a new platform that is not yet enabled ──
  # To surface a planned-but-not-ready *platform* (grayed out in the Platform
  # dropdown), add (1) a combination that references it with an empty template
  # and (2) a matching `platforms:` label entry (see the commented block below).
  # Uncomment both to see a grayed Platform option under Fed Aero → Generic
  # Handheld Blueprint. When the template is authored, drop the empty
  # `template: ""` and point it at the real file to enable the platform.
  #
  # - vertical: fed-aero
  #   sku: generic-handheld-blueprint
  #   platform: nvl
  #   os: ubuntu24
  #   imageType: raw
  #   template: ""

  # EdgePack platform-enablement images. Both templates in each (sku, os) pair
  # support Panther Lake and Wildcat Lake identically, so each pair gets one
  # combination per platform, both pointing at the same template (same pattern
  # as the robotics-jazzy-ubuntu24 sku above).
  #
  # The ISO templates declare a sudo-enabled `admin` user whose only
  # credential is additionalfiles/base-platform/admin.pub, which ships with no
  # keys in it. The Basic tab's credential prompt lets a caller supply
  # `--ssh-authorized-key`/a password for `admin` at build time.
  - vertical: platform-enablement
    sku: edgepack
    platform: ptl
    os: ubuntu24
    imageType: iso
    template: ubuntu24/ubuntu24-x86_64-edgepack-unattended-iso.yml

  - vertical: platform-enablement
    sku: edgepack
    platform: wcl
    os: ubuntu24
    imageType: iso
    template: ubuntu24/ubuntu24-x86_64-edgepack-unattended-iso.yml

  - vertical: platform-enablement
    sku: edgepack-server
    platform: ptl
    os: ubuntu24
    imageType: iso
    template: ubuntu24/ubuntu24-x86_64-edgepack-server-unattended-iso.yml

  - vertical: platform-enablement
    sku: edgepack-server
    platform: wcl
    os: ubuntu24
    imageType: iso
    template: ubuntu24/ubuntu24-x86_64-edgepack-server-unattended-iso.yml

  - vertical: platform-enablement
    sku: edgepack
    platform: ptl
    os: ubuntu26
    imageType: iso
    template: ubuntu26/ubuntu26-x86_64-edgepack-unattended-iso.yml

  - vertical: platform-enablement
    sku: edgepack
    platform: wcl
    os: ubuntu26
    imageType: iso
    template: ubuntu26/ubuntu26-x86_64-edgepack-unattended-iso.yml

  - vertical: platform-enablement
    sku: edgepack-server
    platform: ptl
    os: ubuntu26
    imageType: iso
    template: ubuntu26/ubuntu26-x86_64-edgepack-server-unattended-iso.yml

  - vertical: platform-enablement
    sku: edgepack-server
    platform: wcl
    os: ubuntu26
    imageType: iso
    template: ubuntu26/ubuntu26-x86_64-edgepack-server-unattended-iso.yml

verticals:
  - id: retail
    displayName: Retail Edge
  - id: robotics
    displayName: Robotics
  - id: fed-aero
    displayName: Fed Aero
  - id: platform-enablement
    displayName: Platform Enablement

skus:
  - id: desktop-virtualization
    displayName: Desktop Virtualization
  - id: robotics-jazzy-ubuntu24
    displayName: Autonomous Mobile Robots (AMR)
  - id: generic-handheld-blueprint
    displayName: Generic Handheld Blueprint
  - id: generic-companion-os-server-blueprint
    displayName: Generic Companion OS Server Blueprint
  - id: drone-image-bkc
    displayName: Drone Image - From BKC Team
  - id: edgepack
    displayName: EdgePack Minimal Desktop
  - id: edgepack-server
    displayName: EdgePack Minimal Server

platforms:
  - id: arl
    displayName: ARL (Arrow Lake)
  - id: wcl
    displayName: WCL (Wildcat Lake)
  - id: ptl
    displayName: PTL (Panther Lake)
  # EXAMPLE (commented): label for the not-yet-enabled platform above. A missing
  # label makes the dropdown fall back to the raw id ("nvl"), so add one here.
  # - id: nvl
  #   displayName: NVL (Nova Lake)

targets:
  - id: debian13
    displayName: Debian 13
    os: debian
    arch: x86_64
  - id: ubuntu24
    displayName: Ubuntu 24.04
    os: ubuntu
    arch: x86_64
  - id: ubuntu26-server
    displayName: Ubuntu 26.04 Server
    os: ubuntu
    arch: x86_64
  - id: ubuntu26
    displayName: Ubuntu 26.04
    os: ubuntu
    arch: x86_64
