name: ICT Image Preflight

on:
  pull_request:
    paths:
      - 'Earthfile'
      - 'build/ict/Dockerfile'
      - '.dockerignore'
      - 'internal/utils/shell/shell.go'
      - 'scripts/preflight.sh'
      - 'scripts/container-build.sh'
      - 'scripts/build-in-container.sh'
      - '.github/workflows/ict-image-preflight.yml'
  push:
    branches:
      - main
    paths:
      - 'Earthfile'
      - 'build/ict/Dockerfile'
      - '.dockerignore'
      - 'internal/utils/shell/shell.go'
      - 'scripts/preflight.sh'
      - 'scripts/container-build.sh'
      - 'scripts/build-in-container.sh'
      - '.github/workflows/ict-image-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Validate ICT image toolchain and smoke build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Setup Earthly
        uses: earthly/actions-setup@43211c7a0eae5344d6d79fb4aaf209c8f8866203 #v1.0.13
        with:
          version: 0.8.15

      - name: Build ICT image and run preflight
        run: earthly +ict-image-preflight

      # +ict-image-preflight builds from +ict-image but does not export it;
      # this reuses Earthly's cache and loads ict:latest into Docker.
      - name: Load ICT image into Docker
        run: earthly +ict-image

      # The image, Earthly's cache, a raw build and its copied artifacts all
      # share the runner's disk; drop preinstalled SDKs this job never uses.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # Builds through scripts/build-in-container.sh, the path users take, so the
      # mounts and the artifact copy are exercised along with the build.
      - name: Smoke build inside the ICT image
        shell: bash
        run: |
          scripts/build-in-container.sh \
            image-templates/ubuntu24/ubuntu24-x86_64-minimal-raw.yml "$RUNNER_TEMP/ict-out" \
            2>&1 | tee "$RUNNER_TEMP/smoke-build.log"
          grep -q "image build completed successfully" "$RUNNER_TEMP/smoke-build.log"
          find "$RUNNER_TEMP/ict-out" -name '*.raw*' -print | grep .
