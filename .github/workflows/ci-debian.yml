name: Debian Package

on:
  push:
    tags: ['ict-*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      harbor_test_only:
        description: Test Harbor connectivity and login without building or pushing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: debian-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  harbor-test:
    if: github.event_name == 'workflow_dispatch' && inputs.harbor_test_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Harbor DNS and HTTPS
        env:
          HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY }}
        shell: bash
        run: |
          set -euo pipefail
          : "${HARBOR_REGISTRY:?Configure HARBOR_REGISTRY}"
          if [[ "${HARBOR_REGISTRY}" != gar-registry.caas.intel.com ]]; then
            echo "::error::This diagnostic only supports the approved Harbor registry"
            exit 1
          fi
          if ! getent ahosts "${HARBOR_REGISTRY}"; then
            echo "::error::Harbor DNS resolution failed on ubuntu-latest"
            exit 1
          fi
          if ! status="$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            "https://${HARBOR_REGISTRY}/v2/")"; then
            echo "::error::Harbor HTTPS connection failed; login was not attempted"
            exit 1
          fi
          case "${status}" in
            200|401) ;;
            *)
              echo "::error::Unexpected Harbor registry response: HTTP ${status}"
              exit 1
              ;;
          esac
      - name: Test Harbor login without pushing
        env:
          HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          DOCKER_CONFIG: ${{ runner.temp }}/harbor-login-test
        shell: bash
        run: |
          set -euo pipefail
          : "${HARBOR_USERNAME:?Configure HARBOR_USERNAME}"
          : "${HARBOR_PASSWORD:?Configure HARBOR_PASSWORD}"
          mkdir -m 700 "${DOCKER_CONFIG}"
          trap 'rm -f "${DOCKER_CONFIG}/config.json"; rmdir "${DOCKER_CONFIG}"' EXIT
          printf '%s' "${HARBOR_PASSWORD}" |
            docker login "${HARBOR_REGISTRY}" \
              --username "${HARBOR_USERNAME}" --password-stdin
          echo "Harbor login succeeded. No image was built or pushed." >> "${GITHUB_STEP_SUMMARY}"

  security:
    if: github.event_name != 'workflow_dispatch' || !inputs.harbor_test_only
    uses: ./.github/workflows/pre-merge.yml
    with:
      run_govulncheck: true

  lint:
    if: github.event_name != 'workflow_dispatch' || !inputs.harbor_test_only
    uses: ./.github/workflows/go-lint.yml

  tests:
    if: github.event_name != 'workflow_dispatch' || !inputs.harbor_test_only
    permissions:
      contents: write
    uses: ./.github/workflows/unit-test-and-coverage-gate.yml
    with:
      disable_ratchet: true

  codeql:
    if: github.event_name != 'workflow_dispatch' || !inputs.harbor_test_only
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e #v7.0.0
        with:
          go-version: '1.26'
          cache: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@0499de31b99561a6d14a36a5f662c2a54f91beee #v4.31.2
        with:
          languages: go
          build-mode: manual
          queries: security-extended
      - name: Build Go sources
        run: go build -a ./...
      - name: Analyze Go sources
        uses: github/codeql-action/analyze@0499de31b99561a6d14a36a5f662c2a54f91beee #v4.31.2
        with:
          category: /language:go/debian
          output: codeql-results
          upload: never
      - name: Verify CodeQL report
        run: |
          jq -e '
            .version == "2.1.0" and
            (.runs | length > 0) and
            any(.runs[];
              .tool.driver.name == "CodeQL" and
              (.results | type == "array"))
          ' codeql-results/go.sarif > /dev/null
      - name: Upload CodeQL report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: scan-codeql
          path: codeql-results/
          if-no-files-found: error
          retention-days: 30

  build:
    needs: [security, lint, tests, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            version="${GITHUB_REF_NAME#ict-}"
            version="$(printf '%s' "${version}" | sed -E 's/-(alpha|beta|rc|dev|preview)/~\1/')"
          else
            base="$(sed -nE 's/^## Version ([0-9][0-9.]*)[[:space:]]*$/\1/p' docs/user-guide/release-notes.md | head -1)"
            version="${base}~snapshot.${GITHUB_RUN_NUMBER}.${GITHUB_SHA:0:8}"
          fi
          if [[ ! "${version}" =~ ^[0-9][0-9A-Za-z.+~]*$ ]]; then
            echo "::error::Invalid Debian package version: ${version}"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e #v7.0.0
        with:
          go-version: '1.26'
          cache: false
      - name: Build Debian package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/build-deb.sh --version "${VERSION}"
      - name: Inspect package and checksum
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          file="dist/ict_${VERSION}_amd64.deb"
          test "$(dpkg-deb -f "${file}" Package)" = ict
          test "$(dpkg-deb -f "${file}" Version)" = "${VERSION}"
          test "$(dpkg-deb -f "${file}" Architecture)" = amd64
          dpkg-deb --contents "${file}"
          (cd dist && sha256sum "ict_${VERSION}_amd64.deb" > SHA256SUMS)
      - name: Extract package payload for SBOM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ict-package-root"
          dpkg-deb -x "dist/ict_${VERSION}_amd64.deb" "${RUNNER_TEMP}/ict-package-root"
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ runner.temp }}/ict-package-root
          format: spdx-json
          output: dist/sbom.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: ict-deb-amd64
          path: dist/
          if-no-files-found: error
          retention-days: 30

  install:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:12']
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 #v6.0.0
        with:
          name: ict-deb-amd64
          path: dist
      - name: Install, validate, remove and purge
        env:
          VERSION: ${{ needs.build.outputs.version }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          docker run --rm -v "${PWD}/dist:/dist:ro" -e VERSION \
            "${IMAGE}" bash -euo pipefail -c '
              rm -f /etc/dpkg/dpkg.cfg.d/excludes
              apt-get update -qq
              apt-get install -y --no-install-recommends "/dist/ict_${VERSION}_amd64.deb"
              test "$(dpkg-query -W -f="\${Version}" ict)" = "${VERSION}"
              image-composer-tool version | grep -F "${VERSION}"
              command -v live-installer
              test -s /etc/image-composer-tool/config.yml
              test -s /usr/share/doc/ict/LICENSE
              test -n "$(ls -A /etc/image-composer-tool/config)"
              test -n "$(ls -A /usr/share/image-composer-tool/examples)"
              image-composer-tool --help
              printf "\n# retained edit\n" >> /etc/image-composer-tool/config.yml
              dpkg -r ict
              ! command -v image-composer-tool
              grep -q "retained edit" /etc/image-composer-tool/config.yml
              dpkg --purge ict
              test ! -e /etc/image-composer-tool/config.yml
            '

  image:
    name: Build, scan and publish ICT container
    needs: [security, lint, tests, codeql, build, install]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - name: Resolve image tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="$(date -u +%Y%m%d)-${GITHUB_SHA:0:12}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 #v4.4.0
      - name: Build ICT image
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --target ict \
            --load \
            --build-arg VERSION="${IMAGE_TAG}" \
            --build-arg COMMIT_SHA="${GITHUB_SHA}" \
            --tag "ict:${IMAGE_TAG}" \
            --file build/ict/Dockerfile \
            .
      - name: Verify CLI and web UI
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          image="ict:${IMAGE_TAG}"
          docker run --rm "${image}" image-composer-tool version
          docker run --rm "${image}" image-composer-tool --help

          name="ict-webui-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm -f "${name}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name "${name}" \
            -p 127.0.0.1:18080:8080 \
            "${image}" image-composer-tool serve --host 0.0.0.0
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/ \
              --output "${RUNNER_TEMP}/ict-webui.html"; then
              break
            fi
            sleep 2
          done
          if [[ ! -s "${RUNNER_TEMP}/ict-webui.html" ]]; then
            docker logs "${name}"
            echo "::error::ICT web UI did not return its page"
            exit 1
          fi
          grep -q '<title>Image Composer Tool</title>' "${RUNNER_TEMP}/ict-webui.html"
          grep -q 'id="root"' "${RUNNER_TEMP}/ict-webui.html"
      - name: Smoke-build an OS image
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          scripts/build-in-container.sh \
            --image "ict:${IMAGE_TAG}" \
            image-templates/ubuntu24/ubuntu24-x86_64-minimal-raw.yml \
            "${RUNNER_TEMP}/ict-image-smoke"
          find "${RUNNER_TEMP}/ict-image-smoke" -type f -name '*.raw*' -print -quit | grep .
      - name: Scan image and generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #0.36.0
        with:
          scan-type: image
          image-ref: ict:${{ steps.meta.outputs.tag }}
          vuln-type: os,library
          format: sarif
          output: image-trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: Generate image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #0.36.0
        with:
          scan-type: image
          image-ref: ict:${{ steps.meta.outputs.tag }}
          format: spdx-json
          output: image-sbom.spdx.json
          exit-code: '0'
      - name: Block publishing on HIGH or CRITICAL vulnerabilities
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "ict:${IMAGE_TAG}"
      - name: Publish image to Harbor
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ict-')
        env:
          HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY }}
          HARBOR_PROJECT: ${{ vars.HARBOR_PROJECT }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          : "${HARBOR_REGISTRY:?Configure the HARBOR_REGISTRY repository variable}"
          : "${HARBOR_PROJECT:?Configure the HARBOR_PROJECT repository variable}"
          : "${HARBOR_USERNAME:?Configure the HARBOR_USERNAME repository secret}"
          : "${HARBOR_PASSWORD:?Configure the HARBOR_PASSWORD repository secret}"
          if [[ ! "${HARBOR_REGISTRY}" =~ ^[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then
            echo "::error::HARBOR_REGISTRY must be a registry hostname, without a URL scheme"
            exit 1
          fi
          if [[ ! "${HARBOR_PROJECT}" =~ ^[a-z0-9][a-z0-9._-]*$ ]]; then
            echo "::error::HARBOR_PROJECT is not a valid Harbor project name"
            exit 1
          fi
          image="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/ict-builder:${IMAGE_TAG}"
          printf '%s' "${HARBOR_PASSWORD}" |
            docker login "${HARBOR_REGISTRY}" \
              --username "${HARBOR_USERNAME}" \
              --password-stdin
          trap 'docker logout "${HARBOR_REGISTRY}" >/dev/null 2>&1 || true' EXIT
          docker tag "ict:${IMAGE_TAG}" "${image}"
          docker push "${image}"
          {
            echo "## ICT container image published"
            echo
            echo "- Image: \`${image}\`"
            echo "- Source commit: \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload image scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: ict-container-image-reports
          path: |
            image-trivy.sarif
            image-sbom.spdx.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: [build, install]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Publish download list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" > artifacts.json
          {
            echo "## Published artifacts"
            echo
            echo "Build and installation tests passed on Ubuntu 24.04 and Debian 12."
            echo
            echo "| Artifact | Download |"
            echo "|---|---|"
            jq -r --arg base "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '
              .[].artifacts[] | select(.expired == false) |
              "| " + .name + " | [Download](" + $base + "/artifacts/" + (.id|tostring) + ") |"
            ' artifacts.json
            echo
            echo "Each GitHub Actions artifact downloads as a ZIP."
          } >> "${GITHUB_STEP_SUMMARY}"

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ict-')
    needs: [build, install, image, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 #v6.0.0
        with:
          name: ict-deb-amd64
          path: dist
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          name="ict_${VERSION//\~/.}_amd64.deb"
          mkdir release-assets
          cp "dist/ict_${VERSION}_amd64.deb" "release-assets/${name}"
          cp dist/sbom.spdx.json release-assets/
          (cd release-assets && sha256sum "${name}" sbom.spdx.json > SHA256SUMS)
          cat > release-notes.md <<EOF
          ICT Debian package built from \`${TAG}\`.

          | | |
          |---|---|
          | Package | \`ict\` |
          | Version | \`${VERSION}\` |
          | Architecture | \`amd64\` |
          | Source commit | \`${GITHUB_SHA}\` |

          \`\`\`bash
          sudo apt install ./${name}
          \`\`\`

          Verified: installs, removes and purges cleanly on Ubuntu 24.04 and
          Debian 12, including CLI version/help and installed configuration checks.
          This does not verify OS-image composition.

          The Debian package, SPDX SBOM and SHA256 checksums are attached below.
          Scan and coverage reports are available as artifacts in the
          [workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).
          EOF
          args=(--verify-tag --latest=false)
          [[ "${VERSION}" != *'~'* ]] || args+=(--prerelease)
          encoded="$(jq -rn --arg tag "${TAG}" '$tag|@uri')"
          status="$(curl -sS -o release.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${encoded}")"
          case "${status}" in
            200)
              gh release upload "${TAG}" release-assets/* --clobber --repo "${GITHUB_REPOSITORY}"
              gh release edit "${TAG}" --notes-file release-notes.md --repo "${GITHUB_REPOSITORY}"
              ;;
            404)
              gh release create "${TAG}" release-assets/* "${args[@]}" \
                --title "ICT ${VERSION}" \
                --notes-file release-notes.md \
                --repo "${GITHUB_REPOSITORY}"
              ;;
            *)
              echo "::error::Release lookup failed: HTTP ${status}"
              exit 1
              ;;
          esac
