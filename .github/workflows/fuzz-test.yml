name: Fuzz Test

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      fuzz_time:
        description: "Fuzz duration for each target (for example: 30s, 1m, 5m)"
        required: false
        default: "30s"

permissions:
  contents: read

jobs:
  fuzz-test:
    name: Run Fuzz Tests
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 #v7.1.0
        with:
          go-version: '1.26'

      - name: Prepare fuzz runner
        run: |
          chmod +x ./run_fuzz_tests.sh

      - name: Run fuzz tests
        env:
          FUZZ_TIME: ${{ github.event.inputs.fuzz_time }}
        run: |
          ./run_fuzz_tests.sh

      - name: Upload fuzz report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: fuzz-test-report-${{ github.run_id }}
          path: fuzz_test_report_*.md
          if-no-files-found: warn
          retention-days: 14