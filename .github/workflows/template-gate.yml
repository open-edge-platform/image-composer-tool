name: Template Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: template-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template-gate:
    name: Validate and resolve all image templates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e #v7.0.0
        with:
          go-version: stable

      - name: Build image-composer-tool
        run: go build -buildmode=pie -ldflags "-s -w" -o ./build/image-composer-tool ./cmd/image-composer-tool

      # Runs from the repository root so ./config resolves and the OS defaults
      # actually load; the script fails if they do not, because a degraded run
      # still exits 0 and would pass vacuously.
      - name: Check all image templates
        run: ./scripts/template_gate.sh
