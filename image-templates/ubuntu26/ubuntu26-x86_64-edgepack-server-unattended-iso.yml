# AI-searchable metadata for template discovery
metadata:
  description: Ubuntu 26.04 minimal server unattended ISO installer with Intel EdgePack platform-enablement packages (Panther Lake / Wildcat Lake) installed via native ICT repository and package support
  use_cases:
    - Hands-free bare metal installation of a headless Intel PTL/WCL edge/companion server
    - Minimal Ubuntu server base plus EdgePack, provisioned with cloud-init and first-boot scripts
  keywords:
    - iso
    - unattended
    - installer
    - edgepack
    - intel-edge-base-standard
    - server
    - ptl
    - wcl
    - dkms
    - ubuntu
    - cloud-init
    - provisioning

image:
  name: edgepack-server-os-image-ubuntu-unattended
  version: "26.04.4"

target:
  os: ubuntu
  dist: ubuntu26
  arch: x86_64
  imageType: iso

disk:
  name: EdgePack_Server_ISO
  # Empty path: the installer picks the target disk with selectionPolicy.
  # Set a device (e.g. /dev/nvme0n1) to pin it.
  path: ""
  selectionPolicy:
    strategy: largest
    excludeRemovable: true
    requireEmpty: true
  partitionTableType: gpt
  partitions:
    - id: boot
      type: esp
      flags:
        - esp
        - boot
      start: 1MiB
      end: 513MiB
      fsType: fat32
      mountPoint: /boot/efi
      mountOptions: umask=0077

    # Root fills the selected disk except the last 20 GiB, whatever the disk size.
    # A negative offset is measured back from the end of the disk.
    - id: rootfs
      type: linux-root-amd64
      start: 513MiB
      end: "-20GiB"
      fsType: ext4
      mountPoint: /

    - id: data
      type: linux
      start: "-20GiB"
      end: "-4GiB"
      fsType: ext4
      mountPoint: /data
      mountOptions: defaults,nofail

    - id: swap
      type: linux-swap
      start: "-4GiB"
      end: "0"
      fsType: linux-swap

# EdgePack ships from a per-suite APT repository (suite name follows the host
# Ubuntu release; resolute here).
packageRepositories:
  # EdgePack base/add-on packages, public signed repository.
  - codename: "resolute"
    url: "https://apt.repos.intel.com/edgepack"
    pkey: "https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB"
    component: "stable"

systemConfig:
  initramfs:
    template: default-initrd-unattended-x86_64.yml

  hostname: edgepack-server

  # Pin the network backend to netplan explicitly. Leaving this unset used to
  # let ICT also enable systemd-networkd (its unit ships with the base systemd
  # package regardless), which then raced NetworkManager/cloud-init's own
  # netplan output for control of eth0: DHCP still succeeded and nmcli still
  # showed "connected", but routing became inconsistent and outbound
  # connectivity failed entirely.
  network:
    backend: netplan

  bootloader:
    # preserve: installed OS boots first, existing firmware entries are kept after it.
    bootEntryPolicy: preserve

  packages:
    # systemConfig.packages merges additively with the image-type defaults,
    # which already include ubuntu-minimal. Adding ubuntu-server-minimal (and
    # omitting ubuntu-standard/ubuntu-desktop-minimal) is what distinguishes a
    # "server" image from a desktop one in this repo's own reference
    # blueprints, with no desktop/GUI stack pulled in.
    - ubuntu-server-minimal
    - grub-efi-amd64-signed
    - initramfs-tools
    - grub2-common
    - grub-pc-bin
    - grub-efi-amd64
    - grub-efi-amd64-bin
    - systemd
    - openssh-server
    - netplan.io
    - systemd-resolved
    - systemd-timesyncd
    # ── EdgePack: mandatory base (core graphics/media + NPU/IPU + platform-enablement DKMS drivers) ──
    - intel-edge-base-standard
    # ── EdgePack: optional add-ons ──
    - intel-edge-media-ffmpeg # FFmpeg with Intel GPU support
    - intel-edge-media-gst # GStreamer with Intel GPU support
    - intel-edge-manageability # vPRO manageability
    # ── Required for the platform minimal template ──
    - util-linux-extra
    - dbus-x11
    - libllvm18
    - libdebuginfod1t64
    - dnsmasq-base
    - xdp-tools
    - vim
    - net-tools
    - bluez
    - language-pack-en
    - language-pack-en-base
    - python3-netifaces
    - shim-signed
    - wget
    - cron
    - network-manager
    - nano
    - usb-modeswitch
    - libvirt-sanlock
    - cmake
    - git
    - libssl-dev
    - apt-transport-https
    - git-lfs
    - libglew-dev
    - libglm-dev
    - libsdl2-dev
    - mc
    - python3-pip
    - wayland-protocols
    - msr-tools
    - acpica-tools
    - lsscsi
    - i2c-tools
    # Required for Docker's bridge/NAT networking — install-docker.sh
    # (first-boot provisioning) drops static Docker binaries with no apt
    # dependency resolution, so dockerd needs iptables present already.
    - iptables
    - socat
    - rpm
    - tcpdump
    - fio
    - autoconf
    - automake
    - autoconf-archive
    - libtool
    - gtk-doc-tools
    - libdbus-1-dev
    - libnl-3-dev
    - libnl-genl-3-dev
    - libupower-glib-dev
    - python3-cffi
    - python3-venv

  kernel:
    cmdline: "console=ttyS0,115200 console=tty0 loglevel=7"
    # Pinned to 7.0.0-38. edge-gfx-dkms 7.0 builds against these headers:
    # its Makefile greps the installed intel_vsec.h to detect whether the
    # kernel's intel_vsec API takes a struct pci_dev or a struct device,
    # and defines XE_VSEC_DEVICE_API for xe_vsec.c accordingly (verified
    # against the real 7.0.0-38 headers). Installing exact package names
    # still keeps a newer kernel from being pulled in, which DKMS could
    # fail to build for if a future kernel changes the API again.
    packages:
      - linux-image-7.0.0-38-generic
      - linux-headers-7.0.0-38-generic

  # intel-edge-base-standard pulls in EdgePack's DKMS driver sources
  # transitively. ICT builds them explicitly with `-k <target-kernel>` (never
  # the chroot's `uname -r`). `modules` is left unset: ICT runs `dkms
  # autoinstall` and only asserts that at least one module built. To require
  # specific modules instead, list them as "name/version" (e.g.
  # "edge-gfx-dkms/7.0", matching dkms.conf's PACKAGE_NAME/PACKAGE_VERSION).
  dkms:
    enabled: true
    # Secure Boot signing for the built modules. Left disabled in this sample
    # since it needs a real signing key/cert; enable and point at your
    # organization's key material to sign modules and, optionally, retain the
    # signing identity in the image for future on-target DKMS rebuilds after
    # a kernel update.
    # secureBoot:
    #   enabled: true
    #   signingKeyPath: /run/secrets/edgepack/module-signing.key
    #   signingCertPath: /run/secrets/edgepack/module-signing.crt
    #   retainSigningIdentity: true
    #   targetKeyPath: /var/lib/edgepack/secureboot/module-signing.key
    #   targetCertPath: /var/lib/edgepack/secureboot/module-signing.crt

  # Headless server: pin the default systemd target explicitly so this stays
  # a console boot even if a package (now or in the future) transitively pulls
  # in a display manager, which would otherwise flip default.target to
  # graphical.target on install and strand the system at a failed GUI login.
  configurations:
    - cmd: "systemctl set-default multi-user.target"

  users:
    - name: admin
      # A sudo user needs a credential: the build fails without a password or an
      # SSH key. With only SSH keys the password is locked (key login only) and
      # the user gets passwordless sudo, since there is no password to ask for.
      # Generate a SHA-512 hash with `openssl passwd -6` and paste it here:
      # password: "$6$<salt>$<hash>"
      groups:
        - sudo
        - video
        - render
        - audio
      sudo: true
      shell: /bin/bash
      home: /home/admin
      # Keys can be listed inline (sshAuthorizedKeys) or read from files at build time.
      sshAuthorizedKeysFiles:
        - additionalfiles/base-platform/admin.pub

  # Uncomment to persist a proxy into the deployed system (/etc/environment,
  # apt, and every systemd service). Also settable with --http-proxy etc.
  # proxy:
  #   httpProxy: http://proxy.example.com:3128
  #   httpsProxy: http://proxy.example.com:3128
  #   ftpProxy: http://proxy.example.com:3128
  #   noProxy: localhost,127.0.0.1,.example.com

  cloudInit:
    enabled: true
    userDataFile: additionalfiles/base-platform/user-data
    # DHCP by MAC address so a reserved lab IP survives re-flashing (the
    # machine-id-derived DUID changes on every install).
    networkConfigFile: additionalfiles/base-platform/network-config

  provisioning:
    scripts:
      - name: platform-bootstrap
        local: additionalfiles/base-platform/10-platform-bootstrap.sh
        final: /usr/local/sbin/platform-bootstrap.sh
        stage: first-boot
        order: 10

      - name: edge-node-infra-setup
        local: additionalfiles/base-platform/20-edge-node-infra-setup.sh
        final: /usr/local/sbin/edge-node-infra-setup.sh
        stage: first-boot
        order: 20

  # Developer source archives and other artifacts are copied with additionalFiles.
  # additionalFiles:
  #   - local: additionalfiles/base-platform/platform-src.tar.gz
  #     final: /opt/platform/src/platform-src.tar.gz
