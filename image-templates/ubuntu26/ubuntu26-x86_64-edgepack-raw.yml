# AI-searchable metadata for template discovery
metadata:
  description: Ubuntu 26.04 raw image with Intel EdgePack platform-enablement packages (Panther Lake / Wildcat Lake) installed via native ICT repository and package support
  use_cases:
    - Intel Panther Lake (PTL) / Wildcat Lake (WCL) edge platforms
    - Graphics, media and manageability-enabled Ubuntu 26.04 edge images
    - Reference template for layering vendor APT repositories via packageRepositories
  keywords:
    - edgepack
    - intel-edge-base-standard
    - ptl
    - wcl
    - dkms
    - ubuntu
    - edge

image:
  name: edgepack-os-image-ubuntu
  version: "26.04.3"

target:
  os: ubuntu
  dist: ubuntu26
  arch: x86_64
  imageType: raw

disk:
  name: EdgePack_Raw # 1:1 mapping to the systemConfigs name
  artifacts:
    - type: raw # image file format, valid value [raw, vhd, vhdx, qcow2, vmdk, vdi]
      compression: gz
  # edge-gfx-dkms (xe.ko) build objects overflow 6GiB on 26.04.
  size: 12GiB
  partitionTableType: gpt
  partitions:
    - id: boot
      type: esp
      flags:
        - esp
        - boot
      start: 1MiB
      end: 513MiB
      fsType: fat32
      mountPoint: /boot/efi
      mountOptions: umask=0077

    - id: rootfs
      type: linux-root-amd64
      start: 513MiB
      end: "0"
      fsType: ext4
      mountPoint: /
      mountOptions: defaults

# EdgePack ships from a per-suite APT repository (suite name follows the host
# Ubuntu release; resolute here). Only one repository is needed: NPU, IPU and
# edge-compute-essentials enablement is carried by intel-edge-base-standard
# itself, so no separate NPU package or prerequisite repository is required.
packageRepositories:
  # Firefox as a real .deb. Ubuntu's archive only ships a transitional
  # "firefox" package that installs the snap on first run, and the snap is
  # never fetched in an offline/first-boot image, so the browser would be
  # missing. Take Firefox from Mozilla's official APT repository and pin it
  # for the firefox package only.
  #
  # Not the Mozilla Team PPA: its InRelease is signed with an rsa1024 key
  # that Ubuntu 26.04's apt rejects, so the PPA left on the image makes every
  # later `apt-get update` fail (which stopped the OEP Installer at its first
  # apt step on first boot). Mozilla's key is RSA 2048, which 26.04 accepts.
  - codename: "mozilla"
    url: "https://packages.mozilla.org/apt"
    pkey: "https://packages.mozilla.org/apt/repo-signing-key.gpg"
    component: "main"
    priority: 1001
    allowPackages:
      - firefox

  # EdgePack base/add-on packages, public signed repository.
  - codename: "resolute"
    url: "https://apt.repos.intel.com/edgepack"
    pkey: "https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB"
    component: "stable"
    priority: 1001

  # Intel graphics PPA, pinned to a snapshot (prerequisite repository).
  - codename: "resolute"
    url: "https://snapshot.ppa.launchpadcontent.net/kobuk-team/intel-graphics/ubuntu/20260830T100000Z"
    pkey: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x0c0e6af955ce463c03fc51574d098d70afbe5e1f"
    component: "main"

systemConfig:
  name: edgepack-demo
  description: Ubuntu 26.04 (resolute) image with the EdgePack base metapackage and optional add-ons for PTL/WCL

  bootloader:
    bootType: efi
    provider: grub

  immutability:
    enabled: false # kept simple for this showcase; EdgePack itself has no immutability requirement

  packages:
    - ubuntu-minimal
    - ubuntu-standard
    - ubuntu-desktop-minimal
    - grub-efi-amd64-signed
    - initramfs-tools
    - grub2-common
    - grub-pc-bin
    - grub-efi-amd64
    - grub-efi-amd64-bin
    - systemd
    - openssh-server
    - systemd-resolved
    - systemd-timesyncd
    # edge-gfx-dkms builds a host tool (xe_gen_wa_oob) and needs libc headers, but
    # only depends on dkms. ICT installs packages in list order, so install
    # libc6-dev before intel-edge-base-standard.
    - libc6-dev
    # ── EdgePack: mandatory base (core graphics/media + NPU/IPU + platform-enablement DKMS drivers) ──
    - intel-edge-base-standard
    # ── EdgePack: optional add-ons, shown enabled here for demonstration ──
    - intel-edge-media-ffmpeg # FFmpeg with Intel GPU support
    - intel-edge-media-gst # GStreamer with Intel GPU support
    - intel-edge-manageability # vPRO manageability
    - intel-edge-tsn # Time-sensitive networking (from the Edge Pack repo)
    # IPU camera stack (also installs intel-mipi-gmsl-dkms, new in 2026.3): PTL only
    # (not supported on WCL). Not part of intel-edge-base-standard because its
    # install prompts interactively.
    - intel-edge-ipu # Intel IPU enablement (from the Edge Pack repo)
    - thermald # Intel Dynamic Thermal Management daemon (thermald.service)
    - upower # UPower D-Bus service; intel_lpmd segfaults at startup without org.freedesktop.UPower
    # ── Required for the platform minimal template ──
    - curl
    - util-linux-extra
    - sg3-utils
    - libllvm18
    - libdebuginfod1t64
    - dnsmasq-base
    - xdp-tools
    - firefox
    - vim
    - net-tools
    - bluez
    - language-pack-en
    - language-pack-en-base
    - language-pack-gnome-en
    - language-pack-gnome-en-base
    - python3-netifaces
    - shim-signed
    - network-manager
    - nano
    - usb-modeswitch
    - libvirt-sanlock
    - cmake
    - git
    - libssl-dev
    - apt-transport-https
    - git-lfs
    - libglew-dev
    - libglm-dev
    - libsdl2-dev
    - mc
    - python3-pip
    - wayland-protocols
    - msr-tools
    - lsscsi
    - i2c-tools
    - socat
    - rpm
    - tcpdump
    - cloud-init
    - fio
    - autoconf
    - automake
    - autoconf-archive
    - libtool
    - gtk-doc-tools
    - libdbus-1-dev
    - libnl-3-dev
    - libnl-genl-3-dev
    - libupower-glib-dev
    - python3-cffi
    - python3-venv

  kernel:
    cmdline: "console=ttyS0,115200 console=tty0 loglevel=7"
    # Pinned EdgePack-validated kernel. DKMS builds the modules above against
    # this exact kernel, both at image build time and again on-target.
    packages:
      - linux-image-7.0.0-42-generic
      - linux-headers-7.0.0-42-generic

  # intel-edge-base-standard pulls in EdgePack's DKMS driver sources
  # transitively. ICT builds them explicitly with `-k <target-kernel>` (never
  # the chroot's `uname -r`). `modules` is left unset: ICT runs `dkms
  # autoinstall` and only asserts that at least one module built. To require
  # specific modules instead, list them as "name/version" (e.g.
  # "edge-gfx-dkms/7.0", matching dkms.conf's PACKAGE_NAME/PACKAGE_VERSION).
  dkms:
    enabled: true
    # Secure Boot signing for the built modules. Left disabled in this sample
    # since it needs a real signing key/cert; enable and point at your
    # organization's key material to sign modules and, optionally, retain the
    # signing identity in the image for future on-target DKMS rebuilds after
    # a kernel update.
    # secureBoot:
    #   enabled: true
    #   signingKeyPath: /run/secrets/edgepack/module-signing.key
    #   signingCertPath: /run/secrets/edgepack/module-signing.crt
    #   retainSigningIdentity: true
    #   targetKeyPath: /var/lib/edgepack/secureboot/module-signing.key
    #   targetCertPath: /var/lib/edgepack/secureboot/module-signing.crt
