# AI-searchable metadata for template discovery
metadata:
  description: Ubuntu 26.04 raw image with Intel EdgePack platform-enablement packages (Panther Lake / Wildcat Lake) installed via native ICT repository and package support
  use_cases:
    - Intel Panther Lake (PTL) / Wildcat Lake (WCL) edge platforms
    - Graphics, media and manageability-enabled Ubuntu 26.04 edge images
    - Reference template for layering vendor APT repositories via packageRepositories
  keywords:
    - edgepack
    - intel-edge-base-standard
    - ptl
    - wcl
    - dkms
    - ubuntu
    - edge

image:
  name: edgepack-os-image-ubuntu
  version: "26.04"

target:
  os: ubuntu
  dist: ubuntu26
  arch: x86_64
  imageType: raw

disk:
  name: EdgePack_Raw # 1:1 mapping to the systemConfigs name
  artifacts:
    - type: raw # image file format, valid value [raw, vhd, vhdx, qcow2, vmdk, vdi]
      compression: gz
  size: 6GiB
  partitionTableType: gpt
  partitions:
    - id: boot
      type: esp
      flags:
        - esp
        - boot
      start: 1MiB
      end: 513MiB
      fsType: fat32
      mountPoint: /boot/efi
      mountOptions: umask=0077

    - id: rootfs
      type: linux-root-amd64
      start: 513MiB
      end: "0"
      fsType: ext4
      mountPoint: /
      mountOptions: defaults

# EdgePack ships from a per-suite APT repository (suite name follows the host
# Ubuntu release; resolute here). Only one repository is needed: the NPU
# profile, which needs a separate prerequisite repository, is not available
# on this release yet (see the packages list below).
packageRepositories:
  # EdgePack base/add-on packages, public signed repository.
  - codename: "resolute"
    url: "https://apt.repos.intel.com/edgepack"
    pkey: "https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB"
    component: "stable"

systemConfig:
  name: edgepack-demo
  description: Ubuntu 26.04 (resolute) image with the EdgePack base metapackage and optional add-ons for PTL/WCL

  bootloader:
    bootType: efi
    provider: grub

  immutability:
    enabled: false # kept simple for this showcase; EdgePack itself has no immutability requirement

  packages:
    - ubuntu-minimal
    - ubuntu-desktop-minimal
    - grub-efi-amd64-signed
    - initramfs-tools
    - grub2-common
    - grub-pc-bin
    - grub-efi-amd64
    - grub-efi-amd64-bin
    - systemd
    - openssh-server
    - systemd-resolved
    - systemd-timesyncd
    # ── EdgePack: mandatory base (core graphics/media + NPU/IPU + platform-enablement DKMS drivers) ──
    - intel-edge-base-standard
    # ── EdgePack: optional add-ons, shown enabled here for demonstration ──
    - intel-edge-media-ffmpeg # FFmpeg with Intel GPU support
    - intel-edge-media-gst # GStreamer with Intel GPU support
    - intel-edge-manageability # vPRO manageability

  kernel:
    cmdline: "console=ttyS0,115200 console=tty0 loglevel=7"
    # Floating HWE metapackage: tracks the latest kernel Canonical publishes
    # for 26.04. DKMS builds the modules above against whatever kernel this
    # resolves to, both at image build time and again on-target after an HWE
    # kernel update.
    packages:
      - linux-image-generic-hwe-26.04
      - linux-headers-generic-hwe-26.04

  # intel-edge-base-standard pulls in EdgePack's DKMS driver sources
  # transitively. ICT builds them explicitly with `-k <target-kernel>` (never
  # the chroot's `uname -r`). `modules` is left unset: ICT runs `dkms
  # autoinstall` and only asserts that at least one module built. To require
  # specific modules instead, list them as "name/version" (e.g.
  # "edge-gfx-dkms/7.0", matching dkms.conf's PACKAGE_NAME/PACKAGE_VERSION).
  dkms:
    enabled: true
    # Secure Boot signing for the built modules. Left disabled in this sample
    # since it needs a real signing key/cert; enable and point at your
    # organization's key material to sign modules and, optionally, retain the
    # signing identity in the image for future on-target DKMS rebuilds after
    # a kernel update.
    # secureBoot:
    #   enabled: true
    #   signingKeyPath: /run/secrets/edgepack/module-signing.key
    #   signingCertPath: /run/secrets/edgepack/module-signing.crt
    #   retainSigningIdentity: true
    #   targetKeyPath: /var/lib/edgepack/secureboot/module-signing.key
    #   targetCertPath: /var/lib/edgepack/secureboot/module-signing.crt
