    - libva-glx2_2.24.1-1ppa1~resolute1
    - libva-wayland2_2.24.1-1ppa1~resolute1
    - libva-x11-2_2.24.1-1ppa1~resolute1
    - libva2_2.24.1-1ppa1~resolute1
    - libigdgmm-dev_22.10.2-1ppa1~resolute1
