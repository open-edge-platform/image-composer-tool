metadata:
  description: Ubuntu 26.04 Nova Lake cBKC overlay with Intel 7.3 kernel and platform userspace
  use_cases:
    - Enable NVL on an installed Ubuntu 26.04 GRUB baseline without rebuilding the OS
    - Reproduce the NVL non-RT cBKC repository snapshot and package versions
  keywords: [ubuntu, resolute, nvl, novalake, bkc, overlay, intel, raw]

image:
  name: ubuntu26-nvl-bkc-overlay
  version: "26.04.2"

target:
  os: ubuntu
  dist: ubuntu26
  arch: x86_64
  imageType: raw

# Installed Ubuntu GRUB disk image used as the overlay baseline.
baseline:
  mode: overlay
  source:
    path: /path/to/ubuntu-26.04-base.raw
    format: raw

# Add and upgrade packages; kernel image and headers are declared in replaceKernel, not packages.
overlayPolicy:
  packageOperation: additive-and-upgrade
  allowDowngrade: true
  conflictPolicy: fail
  kernelCmdline: "xe.max_vfs=7 xe.force_probe=* modprobe.blacklist=i915 udmabuf.list_limit=8192 console=tty0 console=ttyS0,115200n8"
  grubDefault: "Advanced options for Ubuntu>Ubuntu, with Linux 7.3-intel"
  replaceKernel:
    package: linux-image-7.3-intel_261014t080608z-resolute1
    additionalPackages:
      - linux-headers-7.3-intel_261014t080608z-resolute1
    version: "7.3-intel / 261014t080608z-resolute1"

# Output disk name, size limits, and raw artifact format.
disk:
  name: nvl-bkc-overlay
  size: 64GiB
  maxSize: 128GiB
  artifacts:
    - type: raw

systemConfig:
  name: nvl-bkc-overlay
  description: NVL non-RT cBKC enablement on an Ubuntu 26.04 baseline
