    - libwayland-egl1
    - libwayland-server0
    - weston
    - xorg
    - xserver-xorg-core
    - x11-xserver-utils
    - wmctrl
    - xdotool

    # DRM/Mesa graphics: unpinned DRM libraries and tools with exact cBKC Mesa driver pins.
