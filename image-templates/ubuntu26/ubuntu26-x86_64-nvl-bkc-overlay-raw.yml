  configurations:
    # Show the GRUB menu with a five-second timeout.
    - cmd: |
        set -euo pipefail
        sed -i -e 's/^GRUB_TIMEOUT_STYLE=.*/GRUB_TIMEOUT_STYLE=menu/' \
          -e 's/^GRUB_TIMEOUT=.*/GRUB_TIMEOUT=5/' /etc/default/grub
    # Persist signed cBKC/libvirt repositories and the cBKC origin priority in the baseline.
    - cmd: |
        set -euo pipefail
        install -d /usr/share/keyrings /etc/apt/sources.list.d /etc/apt/preferences.d
        work=$(mktemp -d /tmp/nvl-keys.XXXXXX)
        trap 'rm -rf "$work"' EXIT
        curl --fail --location --show-error \
          https://af01p-png.devtools.intel.com/artifactory/hspe-edge-png-local/ubuntu/keys/adl-hirsute-public.gpg \
          -o "$work/internal.key"
        gpg --batch --yes --dearmor -o /usr/share/keyrings/nvl-bkc.gpg "$work/internal.key"
        curl --fail --location --show-error \
          'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x665F3046F49DD62093CB587BD98DF9C59FA36F85' \
          -o "$work/libvirt.key"
        gpg --batch --yes --dearmor -o /usr/share/keyrings/nvl-libvirt.gpg "$work/libvirt.key"
        printf '%s\n' 'Types: deb' \
          'URIs: https://af01p-png.devtools.intel.com/artifactory/hspe-edge-png-local/ubuntu/resolute/resolute/20261023-0019/' \
          'Suites: resolute' 'Components: main non-free multimedia internal kernels' \
          'Signed-By: /usr/share/keyrings/nvl-bkc.gpg' > /etc/apt/sources.list.d/nvl-bkc.sources
        printf '%s\n' 'Types: deb' \
          'URIs: https://ppa.launchpadcontent.net/ubuntu-virt/lp2168017/ubuntu' \
          'Suites: resolute' 'Components: main' 'Signed-By: /usr/share/keyrings/nvl-libvirt.gpg' \
          > /etc/apt/sources.list.d/nvl-libvirt.sources
        printf '%s\n' 'Package: *' 'Pin: origin af01p-png.devtools.intel.com' 'Pin-Priority: 1001' \
          > /etc/apt/preferences.d/nvl-bkc
    # Restore baremetal Wayland settings and add resume support only when dracut is present.
    - cmd: |
        set -euo pipefail
        install -d /etc/X11
        touch /etc/X11/Xwrapper.config
        sed -i '/^allowed_users=/d; /^needs_root_rights=/d' /etc/X11/Xwrapper.config
        printf '%s\n' 'allowed_users=anybody' >> /etc/X11/Xwrapper.config
        sed -i '/^MESA_LOADER_DRIVER_OVERRIDE=pl111$/d' /etc/environment
        if test -f /etc/gdm3/custom.conf; then
          sed -i '/^WaylandEnable=false$/d' /etc/gdm3/custom.conf
        fi
        if command -v dracut >/dev/null 2>&1; then
          install -d /etc/dracut.conf.d
          printf '%s\n' 'add_dracutmodules+=" resume "' > /etc/dracut.conf.d/resume.conf
        fi
    # Install the NVL NPU driver engineering-drop packages.
    - cmd: |
        set -euo pipefail
        work=$(mktemp -d /tmp/nvl-npu.XXXXXX)
        trap 'rm -rf "$work"' EXIT
        curl --fail --location --show-error \
          https://af01p-ir.devtools.intel.com/artifactory/drivers_vpu_linux_client-ir-local/engineering-drops/driver/npu-1.38.1-release_unified-2026-ww38/release/26ww41_NVL_PV_2/external/linux-npu-driver-v1.38.1.20261006-37481778717-ubuntu2604.tar.gz \
          -o "$work/npu.tar.gz"
        tar --no-same-owner --no-same-permissions -xzf "$work/npu.tar.gz" --strip-components=1 -C "$work"
        DEBIAN_FRONTEND=noninteractive dpkg -i "$work"/*.deb
    # Install SOF audio firmware/topologies and NVL GuC graphics firmware.
    - cmd: |
        set -euo pipefail
        install -d /lib/firmware/intel/sof-ipc4/mtl /lib/firmware/intel/sof-ace-tplg /lib/firmware/xe
        audio=https://af01p-png.devtools.intel.com/artifactory/hspe-edge-png-local/ubuntu-mtl-audio-tplg-6/c0/intel
        for file in sof-mtl.ldc sof-mtl.ri; do
          curl --fail --location --show-error "$audio/sof-ipc4/mtl/$file" -o "/lib/firmware/intel/sof-ipc4/mtl/$file"
        done
        for file in sof-mtl-rt711-4ch.tplg sof-mtl-rt711.tplg sof-hda-generic.tplg sof-mtl-es83x6-ssp1-hdmi-ssp02.tplg sof-mtl-hdmi-ssp02.tplg; do
          curl --fail --location --show-error "$audio/sof-ace-tplg/$file" -o "/lib/firmware/intel/sof-ace-tplg/$file"
        done
        for file in nvlpg_guc_70.72.0.bin nvlpm_guc_70.72.0.bin; do
          curl --fail --location --show-error \
            "https://af01p-png.devtools.intel.com/artifactory/hspe-edge-png-local/NVL/GuC/$file" \
            -o "/lib/firmware/xe/$file"
        done
      # Extract the graphics SRIOV toolkit into its existing installation directory.
    - cmd: |
        set -euo pipefail
        install -d /opt/GFX-SRIOV-Toolkit
        work=$(mktemp -d /tmp/nvl-sriov.XXXXXX)
        trap 'rm -rf "$work"' EXIT
        curl --fail --location --show-error \
          https://af01p-png.devtools.intel.com/artifactory/hspe-edge-png-local/ubuntu/sriov-toolkit/sriov-toolkit-v2.1-20260309T102500Z.tar.gz \
          -o "$work/toolkit.tar.gz"
        tar --no-same-owner --no-same-permissions --no-overwrite-dir \
          -xzf "$work/toolkit.tar.gz" -C /opt/GFX-SRIOV-Toolkit

# Build-time repository list for the cBKC snapshot and libvirt PPA.
packageRepositories:
  - codename: resolute
    url: https://af01p-png.devtools.intel.com/artifactory/hspe-edge-png-local/ubuntu/resolute/resolute/20261023-0019/
    pkey: https://af01p-png.devtools.intel.com/artifactory/hspe-edge-png-local/ubuntu/keys/adl-hirsute-public.gpg
    component: main non-free multimedia internal kernels
    priority: 1001
  - codename: resolute
    url: https://ppa.launchpadcontent.net/ubuntu-virt/lp2168017/ubuntu
    pkey: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x665F3046F49DD62093CB587BD98DF9C59FA36F85
    component: main