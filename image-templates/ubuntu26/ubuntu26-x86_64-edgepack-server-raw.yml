# AI-searchable metadata for template discovery
metadata:
  description: Ubuntu 26.04 minimal server raw image with Intel EdgePack platform-enablement packages (Panther Lake / Wildcat Lake) installed via native ICT repository and package support
  use_cases:
    - Intel Panther Lake (PTL) / Wildcat Lake (WCL) headless edge/companion servers
    - Minimal Ubuntu server base plus EdgePack, with no use-case-specific provisioning
  keywords:
    - edgepack
    - intel-edge-base-standard
    - server
    - ptl
    - wcl
    - dkms
    - ubuntu
    - edge

image:
  name: edgepack-server-os-image-ubuntu
  version: "26.04.1"

target:
  os: ubuntu
  dist: ubuntu26
  arch: x86_64
  imageType: raw

disk:
  name: EdgePack_Server_Raw # 1:1 mapping to the systemConfigs name
  artifacts:
    - type: raw # image file format, valid value [raw, vhd, vhdx, qcow2, vmdk, vdi]
      compression: gz
  # edge-gfx-dkms (xe.ko) build objects overflow 6GiB on 26.04.
  size: 12GiB
  partitionTableType: gpt
  partitions:
    - id: boot
      type: esp
      flags:
        - esp
        - boot
      start: 1MiB
      end: 513MiB
      fsType: fat32
      mountPoint: /boot/efi
      mountOptions: umask=0077

    - id: rootfs
      type: linux-root-amd64
      start: 513MiB
      end: "0"
      fsType: ext4
      mountPoint: /
      mountOptions: defaults

# EdgePack ships from a per-suite APT repository (suite name follows the host
# Ubuntu release; resolute here).
packageRepositories:
  # EdgePack base/add-on packages, public signed repository.
  - codename: "resolute"
    url: "https://apt.repos.intel.com/edgepack"
    pkey: "https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB"
    component: "stable"

systemConfig:
  name: edgepack-server-demo
  description: Ubuntu 26.04 (resolute) minimal server image with the EdgePack base metapackage and media/manageability add-ons

  bootloader:
    bootType: efi
    provider: grub

  immutability:
    enabled: false # kept simple for this showcase; EdgePack itself has no immutability requirement

  packages:
    # systemConfig.packages merges additively with the raw-image defaults,
    # which already include ubuntu-minimal. Adding ubuntu-server-minimal (and
    # omitting ubuntu-standard/ubuntu-desktop-minimal) is what distinguishes a
    # "server" image from a desktop one in this repo's own reference
    # blueprints, with no desktop/GUI stack pulled in.
    - ubuntu-server-minimal
    - grub-efi-amd64-signed
    - initramfs-tools
    - grub2-common
    - grub-pc-bin
    - grub-efi-amd64
    - grub-efi-amd64-bin
    - systemd
    - openssh-server
    - systemd-resolved
    - systemd-timesyncd
    # ── EdgePack: mandatory base (core graphics/media + NPU/IPU + platform-enablement DKMS drivers) ──
    - intel-edge-base-standard
    # ── EdgePack: optional add-ons ──
    - intel-edge-media-ffmpeg # FFmpeg with Intel GPU support
    - intel-edge-media-gst # GStreamer with Intel GPU support
    - intel-edge-manageability # vPRO manageability
    # ── Required for the platform minimal template ──
    - util-linux-extra
    - dbus-x11
    - libllvm18
    - libdebuginfod1t64
    - dnsmasq-base
    - xdp-tools
    - firefox
    - vim
    - net-tools
    - bluez
    - language-pack-en
    - language-pack-en-base
    - language-pack-gnome-en
    - language-pack-gnome-en-base
    - python3-netifaces
    - shim-signed
    - wget
    - cron
    - network-manager
    - nano
    - usb-modeswitch
    - libvirt-sanlock
    - cmake
    - git
    - libssl-dev
    - apt-transport-https
    - git-lfs
    - libglew-dev
    - libglm-dev
    - libsdl2-dev
    - mc
    - python3-pip
    - wayland-protocols
    - msr-tools
    - lsscsi
    - i2c-tools
    - socat
    - rpm
    - tcpdump
    - fio
    - autoconf
    - automake
    - autoconf-archive
    - libtool
    - gtk-doc-tools
    - libdbus-1-dev
    - libnl-3-dev
    - libnl-genl-3-dev
    - libupower-glib-dev
    - python3-cffi
    - python3-venv

  kernel:
    cmdline: "console=ttyS0,115200 console=tty0 loglevel=7"
    # Pinned EdgePack-validated kernel. DKMS builds the modules above against
    # this exact kernel, both at image build time and again on-target.
    packages:
      - linux-image-7.0.0-34-generic
      - linux-headers-7.0.0-34-generic

  # intel-edge-base-standard pulls in EdgePack's DKMS driver sources
  # transitively. ICT builds them explicitly with `-k <target-kernel>` (never
  # the chroot's `uname -r`). `modules` is left unset: ICT runs `dkms
  # autoinstall` and only asserts that at least one module built. To require
  # specific modules instead, list them as "name/version" (e.g.
  # "edge-gfx-dkms/7.0", matching dkms.conf's PACKAGE_NAME/PACKAGE_VERSION).
  dkms:
    enabled: true
    # Secure Boot signing for the built modules. Left disabled in this sample
    # since it needs a real signing key/cert; enable and point at your
    # organization's key material to sign modules and, optionally, retain the
    # signing identity in the image for future on-target DKMS rebuilds after
    # a kernel update.
    # secureBoot:
    #   enabled: true
    #   signingKeyPath: /run/secrets/edgepack/module-signing.key
    #   signingCertPath: /run/secrets/edgepack/module-signing.crt
    #   retainSigningIdentity: true
    #   targetKeyPath: /var/lib/edgepack/secureboot/module-signing.key
    #   targetCertPath: /var/lib/edgepack/secureboot/module-signing.crt
