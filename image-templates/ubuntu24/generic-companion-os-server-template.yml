---
# SPDX-FileCopyrightText: (C) 2026 Intel Corporation
# SPDX-License-Identifier: Apache-2.0

image:
  name: minimal-ubuntu-server
  version: "24.04"

target:
  os: ubuntu
  dist: ubuntu24
  arch: x86_64
  imageType: raw

# Disk layout and output artifact definition
disk:
  name: minimal-ubuntu-server
  artifacts:
    - type: raw
      compression: gz
  size: 32GiB
  # TODO optimise size
  partitionTableType: gpt
  partitions:
    # EFI system partition
    - id: EFI
      name: EFI
      type: esp
      typeUUID: c12a7328-f81f-11d2-ba4b-00a0c93ec93b
      fsType: vfat
      fsLabel: UEFI
      start: 1MiB
      end: 1025MiB
      mountPoint: /boot/efi
      mountOptions: defaults
      flags:
        - boot
        - esp
    # Swap partition
    - id: SWAP
      name: SWAP
      type: linux-swap
      typeUUID: 0657fd6d-a4ab-43c4-84e5-0933c84b4f4f
      fsType: linux-swap
      start: 1025MiB
      end: 5073MiB
      mountPoint: none
      mountOptions: sw
      flags: []
    # Root filesystem
    - id: ROOT
      name: ROOT
      type: linux-root-amd64
      typeUUID: 4f68bce3-e8cd-4db1-96e7-fbcaf984b709
      fsType: ext4
      start: 5073MiB
      end: "0"
      mountPoint: /
      mountOptions: defaults
      flags: []

# Additional package repositories for this image
packageRepositories:
  - codename: "noble/snapshots/2026_S_REL3-meta-data-fix"
    url: "https://download.01.org/edge-linux-overlay/ubuntu"
    pkey: "https://download.01.org/edge-linux-overlay/ubuntu/9C63745D2A211728B8CE98C5F84B1B6A704E41B2.gpg"
    component: "main non-free multimedia kernels"
    priority: 2000
    allowPackages:
    # Intel GPU Runtime
    # Remove these to disable: Intel GPU compute & memory management
      - libigfxcmrt7
      - libigdgmm12


    # Intel VA-API Drivers
    # Remove these to disable: Intel specific hardware video acceleration drivers
      - intel-media-va-driver
      - intel-media-va-driver-non-free

    # VA-API (Video Acceleration API)
    # Remove these to disable: hardware video decode/encode via VA-API
      - libva-dev
      - libva-drm2
      - libva-glx2
      - libva-wayland2
      - libva-x11-2
      - libva2
      - va-driver-all
      - vainfo

    # Intel VPL / oneVPL (Video Processing Library)
    # Remove these to disable: Intel oneVPL hardware video processing pipeline
      - libmfx-gen1.2
      # overaly dependency for libvpl-dev
      - libvpl2

    # Mesa Vulkan Drivers
    # Remove these to disable: Vulkan GPU rendering
      - mesa-vulkan-drivers


    # System / Firmware
    # Remove these to disable: Linux firmware blobs
      - linux-firmware # must

    # XDP / eBPF High-Speed Networking
    # Remove these to disable: XDP express data path networking
      - xdp-tools
      - libxdp-dev
      - libxdp1
      - iproute2

    # Intel Management & TEE Stack
    # Remove these to disable: Intel ME, LMS service, TEE access
      - rpc-go
      - lms
      - metee

    # Intel Kernel & Tools
    # Remove these to disable: Intel-optimized 6.18 kernel with headers and tools
    #
    # Every package the internal repo publishes for the 6.18 line. Tools are named
    # `linux-intel-<tool>`, not `linux-<tool>-6.18-intel` — same spellings as
    # installer.sh:474. Keep this list in sync with systemConfig.packages; an entry
    # there but not here silently falls back to the Ubuntu archive build.
    # Revisit the whole block if this template moves off 6.18.
      - linux-headers-6.18-intel # must
      - linux-image-6.18-intel # must
      - linux-kbuild-6.18.38
      - linux-config-6.18
      - linux-intel-bpftool
      - linux-intel-misc-tools
      - linux-intel-perf
      - linux-intel-cpupower
      - linux-intel-rtla
      - linux-intel-usbip
      - libcpupower-intel-dev
      - libcpupower-intel1
      - linux-intel-hyperv-daemons
      - linux-intel-sdsi
    # Kernel docs and source tree, ~362MB installed. The -intel packages are
    # 10KB wrappers that only Depend on the real ones, so all four go together.
      - linux-doc-6.18
      - linux-doc-intel
      - linux-source-6.18
      - linux-source-intel
      # - linux-bpf-dev # not in the internal repo; comes from noble-updates

    # Wayland Libraries (overlay version 1.23.0 required by mesa-vulkan-drivers)
    # Remove these to disable: Wayland display protocol libraries
      - libwayland-client0
      - libwayland-server0
      - libwayland-cursor0
      - libwayland-dev
      - libwayland-egl1
      - libwayland-egl-backend-dev
      - libwayland-bin
      - libwayland-doc
      - wayland-protocols

    # GStreamer Multimedia Framework (overlay builds)
    # Remove these to disable: GStreamer pipeline, plugins, RTSP server
      - libgstreamer1.0-0
      - gstreamer1.0-tools
      - gstreamer1.0-plugins-bad
      - gstreamer1.0-plugins-base
      # pin point to internal repository for gstreamer1.0-plugins-good , cant remove requried by bad and pulseaudio plguins
      - gstreamer1.0-plugins-good
      - gstreamer1.0-pulseaudio
      - libgstreamer1.0-dev
      - libgstreamer-gl1.0-0
      - libgstreamer-plugins-bad1.0-0
      - libgstreamer-plugins-base1.0-0
      - gir1.2-gst-plugins-bad-1.0
      - gir1.2-gstreamer-1.0


    # FFmpeg (overlay build) and its libraries
    # Remove these to disable: multimedia encoding/decoding/streaming
      - ffmpeg
      - libavcodec62
      - libavdevice62
      - libavfilter11
      - libavformat62
      - libavutil60
      - libswresample6
      - libswscale9

     # - intel-lpmd


    # LinuxPTP (Precision Time Protocol)
    # Remove these to disable: IEEE 1588 PTP clock synchronization
      - linuxptp


  # ----- OpenVINO -----
  - codename: "ubuntu24"
    url: "https://apt.repos.intel.com/openvino/2025"
    pkey: "https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB"
  # ----- Intel oneAPI (oneDNN / Base Toolkit) -----
  - codename: "all"
    url: "https://apt.repos.intel.com/oneapi"
    pkey: "https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB"
    component: "main"
    priority: 500

  # Docker CE official repository
  - codename: "noble"
    url: "https://download.docker.com/linux/ubuntu"
    pkey: "https://download.docker.com/linux/ubuntu/gpg"
    component: "stable"
    priority: 500


  # ----- Intel RealSense SDK -----
  # ref: https://docs.ros.org/en/iron/p/librealsense2/user_docs/distribution_linux.html
  # TODO: the key ID below is hardcoded; need to find a better way to handle dynamic key discovery
  #       in the packageRepositories section (ICT does not support shell substitution here).
  # To get the current key ID if the build fails with NO_PUBKEY, run:
  #   curl -sSf "https://librealsense.intel.com/Debian/apt-repo/dists/$(lsb_release -cs)/InRelease" \
  #     | gpg --status-fd 1 --verify 2>/dev/null | grep "NO_PUBKEY" | awk '{print $3}'
  # Then update the key ID in the pkey URL below.
  - codename: "noble"
    url: "https://librealsense.intel.com/Debian/apt-repo"
    pkey: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xFB0B24895113F120"
    component: "main"
    priority: 500
    allowPackages:
    # Intel RealSense SDK
    # Remove these to disable: RealSense depth camera runtime and tools
      - librealsense2          # Core SDK runtime library
      - librealsense2-utils    # CLI tools: rs-enumerate-devices, rs-depth, rs-color, rs-fw-update
      - librealsense2-dev      # SDK headers (needed to build custom RealSense apps)
      - librealsense2-dkms
      - librealsense2-gl

  # ----- Mozilla Team PPA (Firefox .deb, avoids Ubuntu's snap-transitional package) -----
  - codename: "noble"
    url: "https://ppa.launchpadcontent.net/mozillateam/ppa/ubuntu"
    pkey: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x0AB215679C571D1C8325275B9BDB3D89CE49EC21"
    component: "main"
    priority: 1001

  # Intel ECI repository (aligned with eci.intel.com setup instructions)
  # apt equivalent: deb [signed-by=...] https://eci.intel.com/repos/noble isar main
  # NOTE: [trusted=yes] workaround — the GPG key and Release signature are valid
  # (verified externally with gpg), but ICT's Go openpgp library fails to verify
  # this particular binary key format. Revert to the pkey URL once ICT is fixed:
  #   pkey: "https://eci.intel.com/repos/gpg-keys/GPG-PUB-KEY-INTEL-ECI.gpg"
  - codename: "isar"
    url: "https://eci.intel.com/repos/noble"
    pkey: "https://eci.intel.com/repos/gpg-keys/GPG-PUB-KEY-INTEL-ECI.gpg"
    component: "main"
    priority: 600
    allowPackages:
      - libcamhal-ipu75xa0
      - libcamhal-ipu75xa
      - libcamera-tools
      - libcamhal-common
      - libcamhal0
      # camera HAL dependency tree (ipu75xa imaging algorithm libs)
      # - libcamhal*
      - libia-*-ipu75xa0
      # GStreamer icamerasrc plugin (Recommends of libcamhal0, not auto-pulled)
      - gstreamer1.0-icamera
      - libgsticamerainterface-1.0-1
      # MIPI GMSL deserializer DKMS module (builds on first boot via dkms autoinstall)
      - intel-mipi-gmsl-dkms
      # v4l-utils >= 1.30 required by intel-mipi-gmsl-dkms (Ubuntu archive only has 1.26)
      - v4l-utils
      - libv4l-0t64
      - libv4l2rds0t64
      - libv4lconvert0t64


systemConfig:
  name: minimal-ubuntu-server
  description: Ubuntu 24.04 server image with Intel packages from Ubuntu archive and overlay
  hostname: minimal-server-ubuntu
  immutability:
    enabled: false

  bootloader:
    bootType: efi
    provider: grub

  packages:
    # Core System
    # Remove these to disable: essential system binaries, shell, coreutils
      - base-files # must
      - bash # must
      - bsdutils # must
      - coreutils # must
      - dash # must
      - debianutils # must
      - diffutils # must
      - findutils # must
      - grep # must
      - gzip # must
      - hostname # must
      - init # must
      - login # must
      - mawk # must
      - ncurses-base # must
      - ncurses-bin # must
      - sed # must
      - systemd # must
      - util-linux # must
      - libattr1


    # Ubuntu Meta-packages
    # Remove these to disable: Ubuntu server essentials meta-package
      - ubuntu-server-minimal # must

    # Kernel
    # Remove these to disable: generic Ubuntu kernel, firmware, initramfs
      - linux-firmware # must
      - linux-base # must
      - initramfs-tools # must

    # Bootloader (EFI / GRUB)
    # Remove these to disable: EFI boot, GRUB bootloader, Secure Boot shim
      - grub-efi-amd64 # must
      - grub-efi-amd64-signed # must
      - grub-efi-amd64-bin # must
      - grub-pc-bin
      - grub2-common # must
      - shim-signed # must
      - efibootmgr # must

    # Networking
    # Remove these to disable: IP configuration, DNS, firewall, download tools
      - iproute2 # must
      - isc-dhcp-client # must
      - iputils-ping
      - netplan.io # must
      - network-manager
      - libbluetooth3
      - networkd-dispatcher
      - systemd-resolved # must
      - net-tools
      - ethtool
      - curl
      - wget
      - ca-certificates # must
      - dns-root-data
      - dnsutils
      - ufw
      - bridge-utils # required, libvirt creates virbr0 bridge for virtual networks
      - dnsmasq-base # required, libvirt uses dnsmasq for DHCP/DNS on virtual networks
      - wireless-regdb # optional, WiFi regulatory compliance database

    # SSH
    # Remove these to disable: remote SSH access
      - openssh-server # must

    # mDNS / Service Discovery
    # Remove these to disable: mDNS hostname.local discovery via Avahi
      - avahi-daemon # required for mDNS hostname.local discovery (BSP feature)
      - avahi-utils
      - libavahi-client3
      - libavahi-common-data
      - libavahi-common3
      - libavahi-core7
      - libavahi-glib1
      - libnss-mdns # required, NSS module enabling .local hostname resolution via Avahi

    # Intel RealSense Camera
    # Requires: Intel RealSense repository (packageRepositories section above)
    # Hardware: USB3 connection; udev rules auto-installed by librealsense2 postinst
    # Verify: rs-enumerate-devices
      - librealsense2          # Core SDK runtime
      - librealsense2-utils    # CLI tools (rs-enumerate-devices, rs-depth, rs-color)
      - librealsense2-dev      # SDK headers for custom application development
      - librealsense2-dkms
      - librealsense2-gl
      - dkms
    # Libcamera Framework
    # Remove these to disable: libcamera support for CSI / USB cameras (V4L2 pipeline)
    # Provides: cam utility (camera enumeration + capture), GStreamer libcamerasrc element
    # Verify: cam --list (lists detected cameras)
    # Note: libcamera-apps (libcamera-hello) is RPi-specific; cam from libcamera-tools
    #       is the standard cross-platform tool available in Ubuntu 24.04 repos
      # libcamera0t64 not listed: pulled automatically as dependency of libcamera-tools
      - libcamera-tools        # 'cam' utility: enumerate and capture from libcamera devices
      - gstreamer1.0-libcamera # GStreamer libcamerasrc element (pipeline integration)

    # Package Management
    # Remove these to disable: APT package manager, GPG verification, PPA support
      - apt # must
      - apt-transport-https
      - apt-utils
      - gpgv # must
      - gnupg
      - software-properties-common

    # System Services
    # Remove these to disable: time sync, logging, cron, auto-updates, snap, D-Bus
      # - systemd-timesyncd
      - chrony
      - rsyslog
      - cron
      - logrotate
      - unattended-upgrades
      - snapd
      - dbus # must
      - udev # must
      - polkitd

    # Storage and Filesystem
    # Remove these to disable: LVM, RAID, filesystem tools, partitioning
      - lvm2
      - mdadm
      - xfsprogs
      - e2fsprogs # must
      - dosfstools # must
      - parted
      - gdisk
      - mount # must
      - thin-provisioning-tools # optional, LVM thin provisioning (used by Docker devicemapper and libvirt)

    # Cloud and Provisioning
    # Remove these to disable: cloud-init based provisioning
      - cloud-init


    # Security
    # Remove these to disable: AppArmor, OpenSSL
      - apparmor
      - openssl # must


    # Performance and Monitoring
    # Remove these to disable: system performance monitoring tools
      - htop
      # - tmon
      # - sysstat
      # - iotop
      # - dstat

    # Diagnostics and Utilities
    # Remove these to disable: text editor, hardware/network diagnostic tools
      - vim
      - tcpdump
      - nano

      # - less
      # - man-db
      # - lsb-release
      # - pciutils
      # - usbutils
      # - lshw
      # - dmidecode
      # - hdparm
      # - smartmontools
      # - strace
      # - iperf3
      # - traceroute
      # - mtr-tiny
      # - socat
      - sysbench
      - stress-ng
      - fio
      - powertop
      - usb-modeswitch
      - v4l-utils
      - libllvm18
      - libdebuginfod1t64


    # Compression and Archiving
    # Remove these to disable: tar, xz, bzip2, zip archive support
      # - tar
      - xz-utils # required by linux-source-6.18
      # - bzip2
      - unzip # optional, extract ZIP archives
      # - zip
      - lzop # optional, LZO compression utility
      - pigz # optional, parallel gzip for faster compression
      - zstd # optional, fast Zstandard compression/decompression
      - xxd # optional, hex dump and reverse utility

    # Language and Locale
    # Remove these to disable: locale and language pack support
      # - locales
      # - language-pack-en

    # Diagnostics and Hardware Tools
    # Remove these to disable: hardware/storage info, sensors, PCI/USB inspection
      - pciutils
      - lsscsi
      - sg3-utils
      - lm-sensors
      - msr-tools
      - i2c-tools
      - util-linux-extra
      - lsb-release
      - cpu-checker # optional, checks KVM/hardware virtualization capability
      - hwdata # optional, hardware identification database (PCI/USB IDs)
      - read-edid # optional, read EDID/MCCS data from display monitors

    # Miscellaneous Server Utilities
    # Remove these to disable: sudo, process tools, revision control, terminal multiplexers
      - sudo # must
      - lsof
      - psmisc
      - at
      - bc
      - file
      - patch
      - rsync
      - screen
      - tmux
      - git
      - git-lfs
      - mc


    # Intel GPU Runtime
    # Remove these to disable: Intel GPU compute & memory management
      - libigfxcmrt7
      - libigdgmm12
      - intel-gpu-tools
      - ocl-icd-libopencl1


    # Mesa Vulkan Drivers
    # Remove these to disable: Vulkan GPU rendering
      - mesa-vulkan-drivers
      - mesa-utils


    # VA-API (Video Acceleration API)
    # Remove these to disable: hardware video decode/encode via VA-API
      - libva-dev
      - libva-drm2
      - libva-glx2
      - libva-wayland2
      - libva-x11-2
      - libva2
      - va-driver-all
      - vainfo

    # Intel VA-API Drivers
    # Remove these to disable: Intel specific hardware video acceleration drivers
      - intel-media-va-driver
      - intel-media-va-driver-non-free

    # Intel VPL / oneVPL (Video Processing Library)
    # Remove these to disable: Intel oneVPL hardware video processing pipeline
      - libvpl2
      - libmfx-gen1.2


    # DRM Libraries
    # Remove these to disable: Direct Rendering Manager userspace libraries
      - libdrm-amdgpu1
      - libdrm-common
      - libdrm-dev
      - libdrm-intel1
      - libdrm-nouveau2
      - libdrm-radeon1
      - libdrm2

    # XDP / eBPF High-Speed Networking
    # Remove these to disable: XDP express data path networking
      - xdp-tools
      - libxdp-dev
      - libxdp1

    # Intel Management & TEE Stack
    # Remove these to disable: Intel ME, LMS service, TEE access
      - rpc-go
      - lms
      - metee

    # Audio (Intel SOF)
    # Remove these to disable: Intel SOF audio firmware
      - firmware-sof-signed # must

    # ALSA Audio Utilities
    # Remove these to disable: ALSA userspace tools and audio mixing/playback
      - alsa-utils
      - libasound2t64
      - libatopology2t64
      - libfftw3-single3
      - libsamplerate0
      - alsa-topology-conf # optional, ALSA topology configuration files for SOF/DSP audio
      - alsa-ucm-conf # optional, ALSA Use Case Manager configs for audio hardware profiles


    # Docker CE Engine
    # Remove these to disable: Docker container runtime
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin

    # Required for k3s/docker networking
      - iptables
      - conntrack
      - socat
      - open-iscsi
      - libip4tc2
      - libxtables12
      - libmnl0
      - libnfnetlink0
      - libnftnl11
      - nftables
      - libseccomp2
      - libc6
      - libsystemd0

    # Required for provisioning scripts
      - jq


    # Wayland Libraries (overlay version 1.23.0 required by mesa-vulkan-drivers)
    # Remove these to disable: Wayland display protocol libraries
      - libwayland-client0
      - libwayland-server0
      - libwayland-cursor0
      - libwayland-dev
      - libwayland-egl1
      - libwayland-egl-backend-dev
      - libwayland-bin
      - libwayland-doc
      - wayland-protocols

    # Intel Kernel & Tools
    # Remove these to disable: Intel-optimized 6.18 kernel with headers and tools
    # Names must match the allowPackages block above. Aliases for the -intel
    # suffixed binaries are created in configurations: below.
      - linux-headers-6.18-intel
      - linux-image-6.18-intel
      - linux-kbuild-6.18.38
      - linux-config-6.18
      - linux-bpf-dev
      - linux-intel-bpftool
      - linux-intel-misc-tools
      - linux-intel-perf
      - linux-intel-cpupower
      - linux-intel-rtla
      - linux-intel-usbip
      - libcpupower-intel-dev
      - libcpupower-intel1
      - linux-intel-hyperv-daemons
      - linux-intel-sdsi
      - linux-doc-6.18
      - linux-doc-intel
      - linux-source-6.18
      - linux-source-intel
    # Dependencies of the above, all from the Ubuntu archive so no allowPackages
    # entry: pahole for linux-kbuild, libjs-sphinxdoc for linux-doc, binutils and
    # xz-utils for linux-source (it ships /usr/src/linux-source-6.18.tar.xz).
      - pahole
      - libjs-sphinxdoc
      - binutils

    # Boot Configuration Utilities
    # Remove these to disable: bootconfig inspection and generation tooling
      # TODO- bootconfig

      - clinfo # optional, OpenCL platform and device enumeration tool (GPU verification)

    # Intel NPU driver dependency
    # The NPU driver (installed later from GitHub in the configurations section)
    # needs this library to work. Without it, the intel-driver-compiler-npu package
    # cannot be set up and 'dpkg -i' would fail with "depends on libtbb12".
    # We list it here so it's already present before the NPU .deb files are installed.
      - libtbb12 # Threading Building Blocks runtime — required by intel-driver-compiler-npu

    # GStreamer Multimedia Framework
    # Remove these to disable: GStreamer pipeline, plugins, RTSP server
      - libgstreamer1.0-0
      - gstreamer1.0-tools
      - gstreamer1.0-plugins-base
      - gstreamer1.0-pulseaudio
      - libgstreamer1.0-dev
      - libgstreamer-gl1.0-0
      - gstreamer1.0-plugins-bad
      - libgstreamer-plugins-bad1.0-0
      - libgstreamer-plugins-base1.0-0
      - gir1.2-gst-plugins-bad-1.0
      - gir1.2-gstreamer-1.0


    # FFmpeg Multimedia
    # Remove these to disable: multimedia encoding/decoding/streaming
      - ffmpeg
      - libavcodec62
      - libavdevice62
      - libavfilter11
      - libavformat62
      - libavutil60
      - libswresample6
      - libswscale9

    # QEMU/KVM Virtualization
    # Remove these to disable: QEMU/KVM virtual machine emulation
      - qemu-block-extra
      - qemu-guest-agent
      - qemu-system
      - qemu-system-arm
      - qemu-system-common
      - qemu-system-data
      - qemu-system-gui
      - qemu-system-mips
      - qemu-system-misc
      - qemu-system-modules-opengl
      - qemu-system-ppc
      - qemu-system-s390x
      - qemu-system-sparc
      - qemu-system-x86
      - qemu-user
      - qemu-user-binfmt
      - qemu-utils
      - libspice-client-glib-2.0-8
      - libspice-client-gtk-3.0-5
      - spice-client-glib-usb-acl-helper
      - spice-client-gtk


    # Libvirt Virtualization Management
    # Remove these to disable: libvirt daemon, drivers, and management tools
      - libvirt-sanlock
      - libtpms0
      - libtpms-dev


    # LinuxPTP (Precision Time Protocol)
    # Remove these to disable: IEEE 1588 PTP clock synchronization
      - linuxptp

    # Build Tools & Development
    # Remove these to disable: compilers, build systems, development headers
      - build-essential
      - make
      - cmake
      - libglew-dev
      - libglm-dev
      - libsdl2-dev
      - pkg-config # optional, queries installed library compiler/linker flags
      - python3-dev # optional, Python 3 development headers for building C extensions
      - manpages # optional, Linux system call and library reference manual pages
      - manpages-dev # optional, developer-oriented manual pages (section 2/3)

    # intel-lpmd v0.1.0 build dependencies (source build in configurations section)
    # These are installed by ICT (network available) so they're present in chroot.
    # Purged after the build in the configurations cleanup step.
      - autoconf
      - automake
      - autoconf-archive
      - libtool
      - gtk-doc-tools
      - libdbus-1-dev
      - libglib2.0-dev
      - libxml2-dev
      - libnl-3-dev
      - libnl-genl-3-dev
      - libsystemd-dev
      - libupower-glib-dev

