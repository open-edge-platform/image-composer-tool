# AI-searchable metadata for template discovery
metadata:
  description: Ubuntu 24.04 raw image with Intel EdgePack platform-enablement packages (Panther Lake / Wildcat Lake) installed via native ICT repository and package support
  use_cases:
    - Intel Panther Lake (PTL) / Wildcat Lake (WCL) edge platforms
    - Graphics, media and manageability-enabled Ubuntu edge images
    - Reference template for layering vendor APT repositories via packageRepositories
  keywords:
    - edgepack
    - intel-edge-base-standard
    - ptl
    - wcl
    - dkms
    - ubuntu
    - edge

image:
  name: edgepack-os-image-ubuntu
  version: "24.04"

target:
  os: ubuntu
  dist: ubuntu24
  arch: x86_64
  imageType: raw

disk:
  name: EdgePack_Raw # 1:1 mapping to the systemConfigs name
  artifacts:
    - type: raw # image file format, valid value [raw, vhd, vhdx, qcow2, vmdk, vdi]
      compression: gz
  size: 6GiB
  partitionTableType: gpt
  partitions:
    - id: boot
      type: esp
      flags:
        - esp
        - boot
      start: 1MiB
      end: 513MiB
      fsType: fat32
      mountPoint: /boot/efi
      mountOptions: umask=0077

    - id: rootfs
      type: linux-root-amd64
      start: 513MiB
      end: "0"
      fsType: ext4
      mountPoint: /
      mountOptions: defaults

# EdgePack ships from a per-suite APT repository (suite name follows the host
# Ubuntu release: noble for 24.04, resolute for 26.04) plus a separate signed
# prerequisite repository the base metapackage's NPU profile resolves from.
packageRepositories:
  # EdgePack base/add-on packages, public signed repository.
  - codename: "noble"
    url: "https://apt.repos.intel.com/edgepack"
    pkey: "https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB"
    component: "stable"

  # NPU prerequisite snapshot repository, required by the base metapackage
  # below: intel-edge-base-standard pulls in the NPU profile, whose client GPU
  # compute runtime is published here rather than in the EdgePack repository.
  # Public Launchpad snapshot; safe to use as-is, but pin/update the snapshot
  # timestamp per EdgePack release notes.
  - codename: "noble"
    url: "https://snapshot.ppa.launchpadcontent.net/kobuk-team/intel-graphics/ubuntu/20260606T100000Z"
    pkey: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x0c0e6af955ce463c03fc51574d098d70afbe5e1f"
    component: "main"

systemConfig:
  name: edgepack-demo
  description: Ubuntu 24.04 (noble) image with the EdgePack base metapackage and optional add-ons for PTL/WCL

  bootloader:
    bootType: efi
    provider: grub

  immutability:
    enabled: false # kept simple for this showcase; EdgePack itself has no immutability requirement

  packages:
    - ubuntu-minimal
    - ubuntu-standard
    - ubuntu-desktop-minimal
    - grub-efi-amd64-signed
    - initramfs-tools
    - grub2-common
    - grub-pc-bin
    - grub-efi-amd64
    - grub-efi-amd64-bin
    - systemd
    - openssh-server
    - systemd-resolved
    - systemd-timesyncd
    # ── EdgePack: mandatory base ──
    # Core graphics/media, the platform-enablement DKMS drivers, and the NPU
    # (intel-edge-npu), IPU (intel-edge-ipu) and edge-compute-essentials
    # profiles, all pulled in transitively. None of those three is listed
    # separately: naming a package the base already installs adds nothing but a
    # second place to keep in step with the metapackage.
    - intel-edge-base-standard
    # ── EdgePack: optional add-ons, shown enabled here for demonstration ──
    - intel-edge-media-ffmpeg # FFmpeg with Intel GPU support
    - intel-edge-media-gst # GStreamer with Intel GPU support
    - intel-edge-manageability # vPRO manageability
    # intel-edge-base-realtime is the alternative base profile but is currently
    # disabled for all OS variants upstream, so it is intentionally omitted here.
    # ── Required for the platform minimal template ──
    - curl
    - util-linux-extra
    - sg3-utils
    - libllvm18
    - libdebuginfod1t64
    - dnsmasq-base
    - xdp-tools
    - firefox
    - vim
    - net-tools
    - bluez
    - language-pack-en
    - language-pack-en-base
    - language-pack-gnome-en
    - language-pack-gnome-en-base
    - shim-signed
    - network-manager
    - nano
    - usb-modeswitch
    - libvirt-sanlock
    - cmake
    - git
    - libssl-dev
    - build-essential
    - apt-transport-https
    - git-lfs
    - libglew-dev
    - libglm-dev
    - libsdl2-dev
    - mc
    - python3-pip
    - wayland-protocols
    - msr-tools
    - lsscsi
    - i2c-tools
    - socat
    - rpm
    - tcpdump
    - cloud-init
    - fio
    - autoconf
    - automake
    - autoconf-archive
    - libtool
    - gtk-doc-tools
    - libdbus-1-dev
    - libxml2-dev
    - libnl-3-dev
    - libnl-genl-3-dev
    - libsystemd-dev
    - libupower-glib-dev
    - python3-cffi
    - python3.12-venv

  kernel:
    cmdline: "console=ttyS0,115200 console=tty0 loglevel=7"
    # Floating HWE metapackage: tracks the latest kernel Canonical publishes
    # for 24.04. DKMS builds the modules above against whatever kernel this
    # resolves to, both at image build time and again on-target after an HWE
    # kernel update.
    packages:
      - linux-image-generic-hwe-24.04
      - linux-headers-generic-hwe-24.04

  # intel-edge-base-standard pulls in EdgePack's DKMS driver sources
  # transitively. ICT builds them explicitly with `-k <target-kernel>` (never
  # the chroot's `uname -r`). `modules` is left unset: ICT runs `dkms
  # autoinstall` and only asserts that at least one module built. To require
  # specific modules instead, list them as "name/version" (e.g.
  # "edge-gfx-dkms/7.0", matching dkms.conf's PACKAGE_NAME/PACKAGE_VERSION).
  dkms:
    enabled: true
    # Secure Boot signing for the built modules. Left disabled in this sample
    # since it needs a real signing key/cert; enable and point at your
    # organization's key material to sign modules and, optionally, retain the
    # signing identity in the image for future on-target DKMS rebuilds after
    # an HWE kernel update.
    # secureBoot:
    #   enabled: true
    #   signingKeyPath: /run/secrets/edgepack/module-signing.key
    #   signingCertPath: /run/secrets/edgepack/module-signing.crt
    #   retainSigningIdentity: true
    #   targetKeyPath: /var/lib/edgepack/secureboot/module-signing.key
    #   targetCertPath: /var/lib/edgepack/secureboot/module-signing.crt
