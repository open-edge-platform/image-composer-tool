# Custom initramfs-tools hook on Debian 13, route 1 of 2.
#
# Everything about the image itself — disk layout, bootloader, kernel and the
# 49-package base — comes from the minimal Debian image. All this template adds
# is the initramfs-tools package, the three hook files, and the commands that
# make them executable.
#
# The dracut equivalent is debian13-x86_64-bb-dracut-raw.yml.
#
# Run `image-composer-tool resolve <this file>` to see the merged result, or
# `--full` to include the OS defaults as they apply at build time.

# AI-searchable metadata for template discovery.
# metadata is not inherited, so every template declares its own.
metadata:
  description: Debian 13 minimal raw image with initrd hello hook via initramfs-tools (GRUB)
  use_cases:
    - Validating custom initramfs-tools scripts on Debian GRUB raw images
    - Lightweight Debian with early-boot initrd marker
  keywords:
    - bb
    - initramfs-tools
    - initrd
    - hello
    - debian
    - grub
    - raw

# Inherit the minimal image: disk layout, bootloader, kernel and base packages.
extends: "debian13-x86_64-minimal-raw.yml"

image:
  name: bb-os-image-debian
  version: "13.0"

target:
  os: debian # Must match the parent's target
  dist: debian13
  arch: x86_64
  imageType: raw

systemConfig:
  name: bb
  description: Minimal debian raw image with initrd hello (initramfs-tools, GRUB)

  # Merged additively on top of the parent's package list.
  packages:
    - initramfs-tools

  # Merged by destination path, so these are added to the parent's entries.
  # Paths are relative to this file, hence ../additionalfiles/.
  additionalFiles:
    - local: ../additionalfiles/debian13-bb/hello.sh
      final: /usr/local/sbin/hello.sh
    - local: ../additionalfiles/debian13-bb/hooks/hello
      final: /etc/initramfs-tools/hooks/hello
    - local: ../additionalfiles/debian13-bb/scripts/init-bottom/hello
      final: /etc/initramfs-tools/scripts/init-bottom/hello

  # Appended after any commands the parent declares, in chain order.
  configurations:
    - cmd: "chmod 755 /usr/local/sbin/hello.sh /etc/initramfs-tools/hooks/hello /etc/initramfs-tools/scripts/init-bottom/hello"
    - cmd: "printf 'Package: systemd-boot systemd-boot-efi\\nPin: release *\\nPin-Priority: -1\\n' > /etc/apt/preferences.d/no-systemd-boot"
    - cmd: "dpkg --purge --force-all systemd-boot systemd-boot-efi 2>/dev/null || true"
