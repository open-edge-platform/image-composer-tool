# =============================================================================
# Debian 13 ("Trixie") BASE overlay template  —  custom dracut initrd  (qcow2)
# Base image
# =============================================================================
#
# Composes a deployable Debian 13 qcow2 from the OFFICIAL Debian 13 generic cloud
# qcow2 using the Image Composer Tool's OVERLAY mechanism. This BASE:
#
#   * takes an official Debian 13 (Trixie) cloud image in qcow2 as its input,
#   * overlays a general-purpose base package set (diagnostics, editors,
#     networking, boot firmware) additively onto the cloud image,
#   * switches the initramfs generator to DRACUT and injects a custom dracut
#     module (91hello) tailored to early-boot needs,
#   * preserves base-image immutability (overlay copies the baseline and layers
#     onto the copy; the source image is never modified in place), and
#   * emits a validated, versioned qcow2 artifact.
#
# It deliberately ships NO graphics/GUI packages: those are added by child
# templates via `extends:`. The graphics layer lives in the sibling child
# template debian13-x86_64-bb-graphics-raw.yml, which adds the GUI stack
# additively on top of this base. Keeping graphics out of the base lets different
# downstream images layer different package sets onto the same base + initrd
# foundation.
#
# A child MUST inherit (NOT redeclare) this file's `baseline` and `overlayPolicy`
# so its added packages merge ADDITIVELY onto the overlay; see the child template
# for the mechanism.
#
# -----------------------------------------------------------------------------
# INPUT IMAGE INTEGRITY (cryptographic checksum verification)
# -----------------------------------------------------------------------------
# baseline.source.url is fetched over TLS (https is REQUIRED and enforced by the
# tool; plain http is rejected), which authenticates the transport. Debian also
# publishes a signed checksum manifest; verify the input's SHA512 against it
# BEFORE the build so the composition runs on a byte-identical source:
#
#   URL     : https://cloud.debian.org/images/cloud/trixie/20260601-2496/debian-13-generic-amd64-20260601-2496.qcow2
#   Format  : qcow2      Architecture: amd64      OS: Trixie (Debian 13)
#   Build   : 2026-06-01                          Build ID: 2496
#
#   curl -fSLO https://cloud.debian.org/images/cloud/trixie/20260601-2496/SHA512SUMS
#   curl -fSLO https://cloud.debian.org/images/cloud/trixie/20260601-2496/SHA512SUMS.sign
#   gpg --verify SHA512SUMS.sign SHA512SUMS          # authenticate the manifest
#   sha512sum -c --ignore-missing SHA512SUMS         # verify the qcow2 matches
#
# To pin to a locally-verified copy instead of re-downloading, replace the
# `url:`/`format:` pair under baseline.source with `path: /verified/debian-13-...qcow2`.
# =============================================================================

# AI-searchable metadata for template discovery
metadata:
  description: >-
    Debian 13 (Trixie) BASE overlay template — overlay an official
    Debian 13 generic cloud qcow2 with a general-purpose base package set
    (diagnostics, editors, networking, boot firmware), switch the initramfs
    generator to dracut and inject a custom dracut module (91hello), emitting a
    versioned qcow2. Extensible base; graphics added by a child via extends.
  use_cases:
    - Compose a deployable Debian 13 qcow2 from the official Debian 13 cloud image
    - Overlay base diagnostic/networking/editor packages onto a Debian 13 cloud image
    - Inject a custom dracut initrd module for boot requirements
    - Replace the baseline's initramfs-tools generator with dracut in an overlay
    - Provide an extensible Debian 13 overlay base for downstream images to extend
  keywords:
    - overlay
    - baseline
    - debian
    - debian13
    - trixie
    - qcow2
    - initrd
    - initramfs
    - dracut
    - base-template
    - extends

image:
  name: debian13-bb-overlay-base
  version: "13.0.2"

target:
  os: debian
  dist: debian13
  arch: x86_64
  imageType: raw   # overlay works on a RAW copy internally; qcow2 is produced at
                   # emit time from disk.artifacts (see the disk block below).

# -----------------------------------------------------------------------------
# Overlay mode — layer onto a copy of the official Debian 13 cloud image.
# The source qcow2 is copied into the build workspace and converted to RAW for
# the overlay; the ORIGINAL input is never modified (base-image immutability).
# -----------------------------------------------------------------------------
baseline:
  mode: overlay
  source:
    url: https://cloud.debian.org/images/cloud/trixie/20260601-2496/debian-13-generic-amd64-20260601-2496.qcow2
    format: qcow2
    # Or pin to a locally checksum-verified copy instead:
    # path: /data/images/debian-13-generic-amd64-20260601-2496.qcow2
    # format: qcow2

# -----------------------------------------------------------------------------
# Output: a qcow2 artifact. The overlay emits a RAW copy, then the Convert
# Artifacts stage produces every format listed here. disk.size is a floor the
# resize always expands the baseline to first (no opt-in needed); the tool then
# auto-sizes further growth from the resolved packages' installed-size metadata
# to leave room for whatever a child template overlays on top, capped at
# disk.maxSize — the final image may end up smaller than 8GiB.
# -----------------------------------------------------------------------------
disk:
  name: overlay-disk
  size: 4GiB
  maxSize: 8GiB
  artifacts:
    - type: qcow2

# -----------------------------------------------------------------------------
# Overlay policy — additive-and-upgrade, plus the ONE removal this base requires.
#
# This base switches the initramfs generator to dracut, and Debian's dracut
# declares an unversioned "Conflicts: initramfs-tools" (which the cloud baseline
# ships). allowPackageRemoval: true lets the overlay resolve that conflict by
# removing initramfs-tools before installing dracut — the ONLY removal this
# template performs. Bootloader and bootable-kernel packages are never removed
# regardless of this flag, so the boot path stays intact.
#
# packageOperation MUST be additive-and-upgrade: allowPackageRemoval is only
# valid under additive-and-upgrade (removal is more invasive than an in-place
# upgrade, so it is not permitted under the default additive-only). This also
# lets the resolver bump a baseline package when a to-install package requires a
# newer version; child templates still add packages additively on top.
#
# conflictPolicy stays fail: any OTHER (unexpected) conflict still fails the
# preflight gate — only the dracut/initramfs-tools swap is turned into a removal.
# -----------------------------------------------------------------------------
overlayPolicy:
  packageOperation: additive-and-upgrade
  conflictPolicy: fail
  # Permit removing a baseline package a to-install package conflicts with. Needed
  # because dracut conflicts with the baseline's initramfs-tools; see note above.
  # Requires packageOperation: additive-and-upgrade (set above).
  #
  # This consent CASCADES: if removing the conflicting package orphans a baseline
  # reverse-dependency (a package that only Depends on the removed one, e.g. the cloud
  # image's cloud-initramfs-growroot depends on initramfs-tools), that orphan is removed
  # too — transitively — so the final image has no unmet dependencies. The cascade is
  # driven by the package manager's own dependency audit (apt-get check), so a
  # dependency an alternative still satisfies is never removed, and it still fails closed
  # if resolving the breakage would require removing a bootloader/kernel-image package.
  allowPackageRemoval: true

systemConfig:
  name: overlay
  description: Debian 13 base — overlaid base packages + custom dracut initrd
  # ---------------------------------------------------------------------------
  # Login account. This BASE bakes NO credential of its own. In MODE A the
  # bring-up script turns ON password SSH, but sshd has nothing to log into until
  # an account exists — and MODE A disables cloud-init, so cloud-init will not
  # create one either. Provide a login here (or in a child/user template) so MODE
  # A yields a usable shell; under MODE B, cloud-init provisions the user instead.
  # Uncomment and set a password HASH, or leave the password unset and drop an
  # authorized_keys via additionalFiles for key-only auth. Do NOT commit a real
  # plaintext password.
  # users:
  #   - name: user
  #     password: "<SHA512-CRYPT HASH>"   # e.g. `mkpasswd -m sha512crypt`; NOT plaintext
  #     groups: ["sudo"]
  # ---------------------------------------------------------------------------
  # Base packages overlaid onto the Debian 13 cloud image. The overlay is
  # additive-and-upgrade (see overlayPolicy above): each package and its
  # not-yet-present transitive dependencies are resolved, downloaded, and
  # installed; a package already in the baseline is left on its baseline version
  # unless a to-install package requires a newer one, in which case it is upgraded
  # in place. The list is therefore safe to over-specify — anything the cloud
  # image already satisfies is simply skipped. Child templates (e.g. the graphics
  # variant) add more on top of these.
  #
  # dracut + dracut-core switch the initramfs generator from the baseline's
  # initramfs-tools to dracut. The overlay removes the conflicting initramfs-tools
  # first (allowPackageRemoval, above), then installs dracut; the overlay's Boot
  # Regeneration stage then rebuilds the initramfs with whatever generator is now
  # installed (dracut), so the 91hello module below is baked in.
  packages:
    # Initramfs generator — replaces the baseline's initramfs-tools (removed by
    # the conflict-driven removal that allowPackageRemoval permits).
    - dracut
    - dracut-core
    # Editors / terminal utilities
    - vim
    - nano
    - less
    - tree
    - jq
    - htop
    - tmux
    - rsync
    # Networking / transfer / diagnostics
    #
    # NB: dnsutils is intentionally omitted to keep this base minimal — use
    # iputils-ping / traceroute for reachability instead. It pulls in bind9-host,
    # which Depends on a version-locked bind9-libs (= same upstream version) newer
    # than the one the Debian cloud baseline ships; under this base's
    # additive-and-upgrade policy the resolver WOULD upgrade bind9-libs in place to
    # satisfy it, so add dnsutils in a child template if a downstream image needs
    # DNS-lookup tooling.
    - curl
    - wget
    - ca-certificates
    - iproute2
    - iputils-ping
    - net-tools
    - traceroute
    - tcpdump
    - openssh-client
    - openssh-server   # SSH login on bare metal (started by bare-metal-bringup.sh at boot)
    # Hardware / system introspection
    - pciutils
    - usbutils
    - efibootmgr   # hardware cleanup: revert EFI boot order back to the host disk
    - lshw
    - lsof
    - strace
    # Firmware the base / initrd may load at boot. firmware-linux-free /
    # firmware-misc-nonfree are the old monolithic packages; trixie splits Intel
    # firmware out into these dedicated packages (same set the
    # image-templates/debian13-x86_64-bb-raw.yml / bb-dracut-raw.yml templates use)
    # — without firmware-intel-graphics the iGPU's GuC/HuC firmware (e.g.
    # i915/mtl_guc_*.bin on Meteor Lake/Arrow Lake) is missing on real hardware,
    # wedging the GPU.
    - firmware-intel-graphics
    - firmware-intel-misc
    - firmware-iwlwifi

  # ---------------------------------------------------------------------------
  # Custom dracut module (91hello) for early-boot requirements.
  #
  # These are the SAME module files the create-mode
  # image-templates/debian13-x86_64-bb-dracut-raw.yml uses, dropped into the
  # dracut module tree at /usr/lib/dracut/modules.d/91hello. Overlay now applies
  # additionalFiles, so the module is delivered declaratively rather than via
  # base64-encoded config commands as before.
  #
  # stage: pre-initramfs is REQUIRED. It copies these files BEFORE the overlay's
  # Boot Regeneration stage runs, so the module is present in the dracut tree when
  # dracut regenerates the initramfs and gets baked in. A default-stage
  # (end-of-build) copy would land AFTER regeneration and the already-built
  # initramfs would ignore it.
  #
  # module-setup.sh registers the module (inst_hook pre-mount 91 hello.sh, plus
  # the cmdline/initqueue hooks that drive initqueue-sample.sh's bounded wait-root
  # poll); hello.sh emits the early-boot kmsg marker.
  #
  # The source scripts are executable (0755) in the repo, and the additionalFiles
  # copy preserves mode (cp -p), so they land executable in the image — no runtime
  # chmod is needed (and none could run here anyway: the configurations stage runs
  # BEFORE this pre-initramfs copy, so a chmod there would not yet see the files).
  additionalFiles:
    - local: additionalfiles/debian13-bb-dracut/modules.d/91hello/module-setup.sh
      final: /usr/lib/dracut/modules.d/91hello/module-setup.sh
      stage: pre-initramfs
    - local: additionalfiles/debian13-bb-dracut/modules.d/91hello/hello.sh
      final: /usr/lib/dracut/modules.d/91hello/hello.sh
      stage: pre-initramfs
    - local: additionalfiles/debian13-bb-dracut/modules.d/91hello/initqueue-sample.sh
      final: /usr/lib/dracut/modules.d/91hello/initqueue-sample.sh
      stage: pre-initramfs

    # ---------------------------------------------------------------------------
    # Bare-metal bring-up (DHCP networking + SSH) — runs at BOOT, not build.
    #
    # The Debian cloud baseline leans on cloud-init to configure networking and
    # SSH from a datasource at first boot. On bare metal there is no datasource,
    # so networking and sshd never come up. Rather than provisioning sshd at build
    # time (which bakes shared host keys and does nothing for networking), the
    # bring-up runs at BOOT via the shared script bare-metal-bringup.sh: DHCP every
    # wired NIC via systemd-networkd, generate PER-DEVICE host keys, start sshd.
    #
    # The script and its systemd unit are delivered regardless of mode; the MODE
    # toggle in configurations (below) decides whether they are activated. In
    # MODE B (cloud) they are shipped but left inert, and cloud-init provisions
    # networking/SSH from the cloud datasource instead. (No cloud-init seed is
    # baked in: a local NoCloud seed would shadow the real cloud datasource.)
    #
    # Default (end-of-build) stage is correct — neither belongs in the initramfs.
    # The script is 0755 in the repo and additionalFiles preserves mode (cp -p),
    # so it lands executable.
    - local: additionalfiles/debian13-bb-baremetal/usr/local/sbin/bare-metal-bringup.sh
      final: /usr/local/sbin/bare-metal-bringup.sh
    - local: additionalfiles/debian13-bb-baremetal/etc/systemd/system/bare-metal-bringup.service
      final: /etc/systemd/system/bare-metal-bringup.service

  # ---------------------------------------------------------------------------
  # Configuration commands run inside the baseline chroot AFTER package install
  # and BEFORE boot regeneration. They enable the 91hello dracut module. The
  # module scripts are already executable (copied 0755 from the repo via
  # additionalFiles, above), and the initramfs itself is (re)built by the overlay's
  # own Boot Regeneration stage, which selects the installed generator (dracut) —
  # no explicit chmod or `dracut` invocation is needed here.
  #
  # NB: this stage runs BEFORE the pre-initramfs additionalFiles copy, so a command
  # here must NOT reference the copied module files (they are not in place yet).
  # Enabling the module via a dracut.conf.d drop-in is safe because it only names
  # the module; dracut resolves the module tree at regeneration time.
  #
  # A child template's configurations merge AFTER these.
  # ---------------------------------------------------------------------------
  configurations:
    # Enable the 91hello module in the composed initramfs.
    - cmd: 'mkdir -p /etc/dracut.conf.d && echo ''add_dracutmodules+=" hello "'' > /etc/dracut.conf.d/91hello.conf'
    # ==========================================================================
    # BARE-METAL vs CLOUD MODE — THE SWITCH. Exactly ONE of the two `- cmd:` lines
    # below is uncommented. To change mode, move the `#`: comment the active line
    # and uncomment the other. Nothing else in this template changes.
    #
    #   MODE A (bare metal) : disable cloud-init, drop baked SSH host keys, enable
    #                         our systemd bring-up.
    #   MODE B (cloud)      : leave cloud-init enabled so it provisions from the
    #                         cloud datasource; our script/unit stay shipped-inert.
    #
    - cmd: mkdir -p /etc/cloud && touch /etc/cloud/cloud-init.disabled && rm -f /etc/ssh/ssh_host_* && mkdir -p /etc/systemd/system/multi-user.target.wants && ln -sf /etc/systemd/system/bare-metal-bringup.service /etc/systemd/system/multi-user.target.wants/bare-metal-bringup.service   # MODE A (default)
    # - cmd: rm -f /etc/cloud/cloud-init.disabled                                                                                                                                                                                            # MODE B
    #
    # WHY: the Debian cloud baseline relies on cloud-init to bring up networking and
    # SSH from a datasource at first boot.
    #
    #   * MODE A (bare metal): there is NO datasource, so cloud-init stalls boot and
    #     never brings up DHCP or sshd (QEMU masked this via instant DHCP). We
    #     DISABLE cloud-init and run bare-metal-bringup.sh from a systemd oneshot
    #     instead — DHCP every wired NIC via systemd-networkd, PER-DEVICE host keys,
    #     start sshd. We also `rm -f /etc/ssh/ssh_host_*` at build so first boot
    #     regenerates keys UNIQUE per unit: ssh-keygen -A only fills in MISSING keys,
    #     so any keys baked by the openssh-server install would otherwise be shared
    #     fleet-wide. The steps are chained with `&&` (not `;`) so the build fails
    #     fast if any of them did not actually happen. We create the wants symlink
    #     directly because `systemctl enable` cannot run in this stage (it executes
    #     before additionalFiles are copied in). Trade-off: disabling cloud-init
    #     forfeits its first-boot rootfs growpart. INSECURE bring-up: password SSH
    #     auth is on.
    #
    #   * MODE B (cloud): there IS a datasource, so leave cloud-init ENABLED and let
    #     it provision networking/SSH normally from the cloud metadata. The `rm -f`
    #     just clears any inherited disable flag; our bring-up script/unit remain
    #     shipped but unenabled, and NO local seed is baked (it would shadow the
    #     cloud datasource).
    #
    # The login account is NOT provisioned by this BASE (see the commented
    # systemConfig.users example near the top of systemConfig). MODE A turns on
    # password SSH, but with cloud-init disabled nothing creates a user, so add
    # one (a password hash or an authorized_keys file) or MODE A starts sshd with
    # no way to log in.
    # ==========================================================================
