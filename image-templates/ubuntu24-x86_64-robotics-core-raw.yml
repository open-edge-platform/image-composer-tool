# Robotics AI Suite — Level 1: ROS 2 Jazzy core stack
#
# Middle layer of a three-level inheritance chain that demonstrates `extends`
# nesting on a real workload:
#
#   ubuntu24-x86_64-minimal-raw.yml        (OEP base: rootfs, GRUB, base packages)
#     └─ ubuntu24-x86_64-robotics-core-raw.yml     (this file: ROS 2 + OpenVINO + GPU)
#          └─ ubuntu24-x86_64-robotics-slam-raw.yml (leaf: SLAM + RealSense + NPU)
#
# On its own this template builds a usable robotics development image: ROS 2
# Jazzy Desktop, Intel OpenVINO 2025, Gazebo Harmonic and Intel GPU/Level-Zero
# support, sized for a 24GiB disk. Deployments that also need collaborative
# SLAM, a RealSense depth camera or NPU offload extend it rather than copy it.
#
# Inspect the resolved chain before building:
#   ./image-composer-tool resolve image-templates/ubuntu24-x86_64-robotics-core-raw.yml --full
#
# Usage:
#   sudo -E ./image-composer-tool build image-templates/ubuntu24-x86_64-robotics-core-raw.yml

# AI-searchable metadata for template discovery
metadata:
  description: ROS 2 Jazzy core robotics stack with Intel OpenVINO and Gazebo Harmonic, extending the Ubuntu 24.04 minimal raw template; intended as a reusable parent layer
  use_cases:
    - Reusable robotics base layer for further extension
    - ROS 2 Jazzy Desktop development environment
    - Intel OpenVINO AI inference on robots
    - Gazebo Harmonic physics simulation
    - Intel GPU acceleration (Xe/UHD Graphics)
  keywords:
    - extends
    - inheritance
    - nesting
    - robotics
    - ros2
    - jazzy
    - openvino
    - gazebo
    - harmonic
    - intel
    - gpu
    - level-zero
    - ubuntu
    - raw

# Level 1 of the chain: inherit the OEP Ubuntu 24.04 minimal raw image.
extends: "ubuntu24-x86_64-minimal-raw.yml"

image:
  name: robotics-core-ubuntu24
  version: "24.04"

target:
  os: ubuntu # Must match every template in the chain
  dist: ubuntu24
  arch: x86_64
  imageType: raw

# Replaces the parent's 4GiB disk wholesale -- `disk` is a whole-block override,
# not a field-level merge, so the full layout is restated here. 24GiB fits ROS 2
# Desktop + Gazebo + OpenVINO + Mesa + firmware, leaving room for the leaf layer.
disk:
  name: robotics-core # 1:1 mapping to the systemConfig name
  artifacts:
    - type: raw
      compression: gz
  size: 24GiB
  partitionTableType: gpt
  partitions:
    - id: boot
      type: esp
      flags:
        - esp
        - boot
      start: 1MiB
      end: 513MiB
      fsType: fat32
      mountPoint: /boot/efi
      mountOptions: umask=0077
    - id: rootfs
      type: linux-root-amd64
      start: 513MiB
      end: "0"
      fsType: ext4
      mountPoint: /
      mountOptions: defaults

# Robotics repositories. The parent declares none, so all seven are added here
# and inherited by anything extending this template.
#
# NOTE: three of these share the codename "noble" (ROS 2, Gazebo, RealSense).
# That is correct -- the codename is the apt suite -- but repositories are merged
# by codename, so a parent that declares its own repository would collapse them.
# See docs/architecture-decision-record/analysis-template-extends-triage.md (D1).
packageRepositories:
  # ROS 2 Jazzy repository
  - codename: "noble"
    url: "http://packages.ros.org/ros2/ubuntu"
    pkey: "https://raw.githubusercontent.com/ros/rosdistro/master/ros.key"
    component: "main"

  # Intel Edge Controls for Industrial (ECI) repository
  # Priority 1000 ensures ECI packages (systemd+ETF/taprio, PCL+oneAPI, FLANN+oneAPI)
  # are preferred over Ubuntu defaults when version strings differ.
  # No allowPackages filter — ECI packages have deep transitive dependency chains
  # that require many ECI-only sub-packages to satisfy.
  - codename: "isar"
    url: "https://eci.intel.com/repos/noble"
    pkey: "https://eci.intel.com/repos/gpg-keys/GPG-PUB-KEY-INTEL-ECI.gpg"
    component: "main"
    priority: 1000

  # Intel AMR (Autonomous Mobile Robots) repository (uses ECI GPG key)
  # Priority 1001 (above ECI) — AMR packages override ECI when both provide the same package.
  - codename: "amr"
    url: "https://amrdocs.intel.com/repos/noble"
    pkey: "https://eci.intel.com/repos/gpg-keys/GPG-PUB-KEY-INTEL-ECI.gpg"
    component: "main"
    priority: 1001

  # Intel OneAPI runtime repository
  - codename: "all"
    url: "https://apt.repos.intel.com/oneapi"
    pkey: "https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB"
    component: "main"

  # Intel OpenVINO 2025 repository
  - codename: "ubuntu24"
    url: "https://apt.repos.intel.com/openvino/2025"
    pkey: "https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB"
    component: "main"

  # Gazebo (OSRF) Harmonic stable repository
  - codename: "noble"
    url: "https://packages.osrfoundation.org/gazebo/ubuntu-stable"
    pkey: "https://packages.osrfoundation.org/gazebo.gpg"
    component: "main"

  # Intel RealSense repository (new URL as of 2026)
  - codename: "noble"
    url: "https://librealsense.realsenseai.com/Debian/apt-repo"
    pkey: "https://librealsense.realsenseai.com/Debian/librealsenseai.asc"
    component: "main"

systemConfig:
  name: robotics-core
  description: Intel Robotics AI Suite - ROS 2 Jazzy core with OpenVINO, Gazebo and Intel GPU support

  # The parent selects GRUB. This image boots via systemd-boot with a UKI -- it
  # installs systemd-boot, dracut-core and cryptsetup-bin below -- so pin the
  # bootloader explicitly instead of inheriting the parent's choice.
  bootloader:
    bootType: efi
    provider: systemd-boot

  # Restated from the parent: this disk has no dm-verity hash partition, so
  # immutability must stay off.
  immutability:
    enabled: false

  packages:
    # ── Base system ──────────────────────────────────────────────────
    # ubuntu-minimal, systemd, systemd-resolved, systemd-timesyncd and
    # openssh-server are inherited from the parent template.
    - ubuntu-desktop-minimal
    - systemd-boot
    - network-manager
    - sudo
    - curl
    - wget
    - vim
    - software-properties-common
    - gnupg
    - lsb-release
    - debconf-utils

    # Boot / initramfs (required for UKI)
    - dracut-core
    - cryptsetup-bin

    # ── Intel OneAPI runtime (pinned to 2025.3.x) ───────────────────
    # Listed before ros-jazzy-desktop so the resolver locks these versions
    # first, preventing transitive deps from pulling 2026.0.0.
    #
    # ORDER-COUPLED: these must stay in the SAME layer as ros-jazzy-desktop.
    # A child's packages always sort after its parent's, so moving either side
    # of this pair into a child template would invert the intended order.
    - intel-oneapi-runtime-compilers_2025.3.3-30
    - intel-oneapi-runtime-compilers-common_2025.3.3-30
    - intel-oneapi-runtime-opencl_2025.3.3-30

    # ── ROS 2 Jazzy Desktop (full) ──────────────────────────────────
    - ros-jazzy-desktop

    # ── Intel OpenVINO 2025 (pinned to 2025.3.0) ─────────────────────
    - openvino_2025.3.0.19807
    - ros-jazzy-openvino-wrapper-lib
    - ros-jazzy-openvino-node

    # ── Intel GPU / Level Zero ──────────────────────────────────────
    - libze1
    - libze-intel-gpu1

    # ── Gazebo Harmonic physics simulator ───────────────────────────
    - gz-harmonic

    # ── Intel Robotics SDK ───────────────────────────────────────────
    - ros-jazzy-robotics-sdk

    # ── Firmware ────────────────────────────────────────────────────
    - linux-firmware

  # kernel.packages REPLACES the parent's list rather than unioning with it.
  kernel:
    cmdline: "console=ttyS0,115200 console=tty0 loglevel=7"
    packages:
      - linux-image-generic-hwe-24.04

  configurations:
    # ── ROS 2 environment setup ────────────────────────────────────
    - cmd: "echo 'source /opt/ros/jazzy/setup.bash' >> /etc/bash.bashrc"
    - cmd: "echo 'export ROS_DOMAIN_ID=42' >> /etc/bash.bashrc"

    # ── Post-deployment APT version pinning (protects against bad upgrades) ──
    # Note: Origin-based priority pins (ECI=1000, AMR=1001) are auto-generated
    # by the provider from packageRepositories.priority fields.
    # Only version-specific pins that the provider cannot generate are listed here.
    #
    # Block old FLANN 1.19.x from ECI (prefer Ubuntu's FLANN 1.9.2)
    - cmd: "printf 'Package: libflann*\\nPin: version 1.19.*\\nPin-Priority: -1\\n\\nPackage: flann*\\nPin: version 1.19.*\\nPin-Priority: -1\\n' > /etc/apt/preferences.d/eci-flann-block"
    # Pin OneAPI packages to 2025.3.* (matches setup-robotics-jazzy.sh exactly)
    - cmd: "printf 'Package: intel-oneapi-runtime-*\\nPin: version 2025.3.*\\nPin-Priority: 1001\\n\\nPackage: intel-oneapi-compiler-*\\nPin: version 2025.3.*\\nPin-Priority: 1001\\n\\nPackage: intel-oneapi-mkl-*\\nPin: version 2025.3.*\\nPin-Priority: 1001\\n' > /etc/apt/preferences.d/oneapi"
    # OpenVINO version pins (match setup-robotics-jazzy.sh exactly)
    - cmd: "printf 'Package: openvino-libraries-dev\\nPin: version 2025.3.0*\\nPin-Priority: 1001\\n\\nPackage: openvino\\nPin: version 2025.3.0*\\nPin-Priority: 1001\\n\\nPackage: ros-jazzy-openvino-wrapper-lib\\nPin: version 2025.3.0*\\nPin-Priority: 1002\\n\\nPackage: ros-jazzy-openvino-node\\nPin: version 2025.3.0*\\nPin-Priority: 1002\\n' > /etc/apt/preferences.d/intel-openvino"
    # RealSense SDK version pin for post-deployment upgrade protection.
    - cmd: "printf 'Package: librealsense2*\\nPin: version 2.56.5-0~realsense.17055\\nPin-Priority: 1001\\n\\nPackage: ros-jazzy-librealsense2*\\nPin: version 2.56.4*\\nPin-Priority: 1001\\n\\nPackage: ros-jazzy-realsense2*\\nPin: version 4.56.4*\\nPin-Priority: 1001\\n' > /etc/apt/preferences.d/librealsense"
